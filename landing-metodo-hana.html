<!-- ============================================================
     MÉTODO HANA · Landing-quiz (Impultienda — bloque HTML completo)
     Pegar tal cual en el constructor "HTML completo".
     No incluye <html>/<head>/<body>. Todo el CSS vive bajo #hana.
     Precio: Impultienda reemplaza {{price}} dentro de #hprice.
     ============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<span id="hprice" style="display:none">{{price}}</span>

<div id="hana">
  <header class="h-header">
    <button class="h-back" id="hBack" aria-label="Volver" type="button">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="h-brand">
      <span class="h-logo">HANA</span>
      <span class="h-tag">Calistenia asiática</span>
    </div>
    <div class="h-progress" aria-hidden="true"><i id="hBar"></i></div>
  </header>

  <!-- barra de urgencia de la oferta (oculta hasta la oferta) -->
  <div class="h-urg" id="hUrg" hidden>
    <span id="hUrgText">⏳ Tu 25% OFF está reservado por <b id="hClock">14:59</b></span>
  </div>

  <main class="h-stage" id="hStage" aria-live="polite"></main>

  <div class="h-foot" id="hFoot" hidden>
    <button class="h-cta" id="hCta" type="button">Continuar</button>
  </div>

<style>
/* ===================== SCOPE #hana ===================== */
#hana *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#hana{
  --acc:#c2456a; --soft:#fbe9ee; --plum:#4a2a4f; --ink:#1d1520;
  --gray:#6f6472; --ok:#2f8a5b; --line:#ecdfe4;
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  color:var(--ink); background:#fff; max-width:560px; margin:0 auto;
  position:relative; min-height:100dvh; display:flex; flex-direction:column;
  overflow-x:hidden;
}
#hana button{font-family:inherit}
#hana img{display:block;max-width:100%}

/* ---------- header ---------- */
#hana .h-header{
  position:sticky; top:0; z-index:30; background:rgba(255,255,255,.96);
  backdrop-filter:blur(6px); display:flex; align-items:center; gap:10px;
  padding:10px 14px 0; border-bottom:1px solid var(--line);
}
#hana .h-back{
  width:38px;height:38px;border:none;background:none;color:var(--plum);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  border-radius:50%;
}
#hana .h-back:active{background:var(--soft)}
#hana .h-back[hidden]{visibility:hidden}
#hana .h-brand{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1}
#hana .h-logo{font-weight:900;font-size:20px;letter-spacing:3px;color:var(--plum)}
#hana .h-tag{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-top:2px}
#hana .h-header .h-spacer{width:38px;flex:0 0 auto}
#hana .h-progress{
  position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--soft);
}
#hana .h-progress i{
  display:block;height:100%;width:0;background:var(--acc);
  border-radius:0 3px 3px 0;transition:width .45s cubic-bezier(.4,0,.2,1);
}

/* ---------- urgencia ---------- */
#hana .h-urg{
  position:sticky;top:49px;z-index:25;background:var(--plum);color:#fff;
  text-align:center;font-size:13px;font-weight:600;padding:9px 14px;
}
#hana .h-urg b{font-weight:800}
#hana .h-urg.h-exp{background:#7a6a5f}

/* ---------- stage ---------- */
#hana .h-stage{flex:1;padding:18px 18px 120px;position:relative}
#hana .h-screen{animation:hIn .32s ease both}
@keyframes hIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  #hana .h-screen{animation:none}
  #hana .h-progress i{transition:none}
}

#hana h1{font-size:26px;font-weight:900;line-height:1.15;letter-spacing:-.4px}
#hana h2{font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.3px}
#hana .h-acc{color:var(--acc)}
#hana .h-kicker{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
#hana .h-sub{color:var(--gray);font-size:14.5px;line-height:1.5;margin-top:8px}
#hana .h-center{text-align:center}

/* imagen genérica (fondo rosa si falla) */
#hana .h-pic{
  width:100%;background:var(--soft);border-radius:20px;overflow:hidden;position:relative;
  aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;margin:0 auto;
}
#hana .h-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hana .h-pic.h-por{aspect-ratio:3/4;max-width:260px}
#hana .h-pic.h-sq{aspect-ratio:1/1}

/* ---------- opciones ---------- */
#hana .h-opts{display:flex;flex-direction:column;gap:11px;margin-top:20px}
#hana .h-opt{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:15px 15px;min-height:60px;cursor:pointer;font-size:16px;font-weight:600;
  color:var(--ink);transition:border-color .15s,background .15s,transform .08s;
}
#hana .h-opt:active{transform:scale(.99)}
#hana .h-opt .h-emo{font-size:24px;flex:0 0 auto;line-height:1}
#hana .h-opt .h-txt{flex:1;line-height:1.25}
#hana .h-opt .h-arw{color:var(--acc);flex:0 0 auto;opacity:.6}
#hana .h-opt .h-chk{
  width:24px;height:24px;border:2px solid var(--line);border-radius:7px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;color:#fff;
}
#hana .h-opt.h-on{border-color:var(--acc);background:var(--soft)}
#hana .h-opt.h-on .h-chk{background:var(--acc);border-color:var(--acc)}
#hana .h-opt .h-mini{
  width:46px;height:46px;border-radius:12px;background:var(--soft);flex:0 0 auto;
  overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:24px
}
#hana .h-opt .h-mini img{width:100%;height:100%;object-fit:cover}

/* ---------- cajas ---------- */
#hana .h-box{
  background:var(--soft);border-radius:16px;padding:15px 16px;margin-top:18px;
  font-size:14px;line-height:1.5;color:var(--plum)
}
#hana .h-box.h-ok{background:#eaf6ef;color:#1f6b45}
#hana .h-note{font-size:11.5px;color:var(--gray);margin-top:12px;line-height:1.45}
#hana .h-lock{font-size:12px;color:var(--gray);margin-top:14px;display:flex;align-items:center;gap:6px;justify-content:center}

/* alertas con viñeta */
#hana .h-alerts{display:flex;flex-direction:column;gap:12px;margin-top:18px}
#hana .h-al{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;line-height:1.4}
#hana .h-al .h-dot{width:10px;height:10px;border-radius:50%;background:var(--acc);margin-top:5px;flex:0 0 auto}
#hana .h-al b{font-weight:700}

/* grilla semanas 2x2 */
#hana .h-weeks{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:18px}
#hana .h-wk{background:var(--soft);border-radius:14px;padding:13px}
#hana .h-wk .n{font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc)}
#hana .h-wk .t{font-size:14px;font-weight:600;margin-top:4px;line-height:1.3}

/* ---------- slider / regla ---------- */
#hana .h-slider{margin-top:26px;text-align:center}
#hana .h-units{display:inline-flex;background:var(--soft);border-radius:30px;padding:4px;margin-bottom:20px}
#hana .h-units button{
  border:none;background:none;padding:8px 20px;border-radius:30px;font-weight:700;
  font-size:14px;color:var(--gray);cursor:pointer;min-height:38px
}
#hana .h-units button.h-on{background:#fff;color:var(--acc);box-shadow:0 2px 8px rgba(0,0,0,.08)}
#hana .h-val{font-size:48px;font-weight:900;color:var(--plum);line-height:1}
#hana .h-val span{font-size:20px;font-weight:700;color:var(--gray);margin-left:4px}
#hana .h-range{width:100%;margin-top:26px;-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;background:var(--line);outline:none}
#hana .h-range::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:var(--acc);border:4px solid #fff;box-shadow:0 2px 10px rgba(194,69,106,.5);cursor:pointer}
#hana .h-range::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:var(--acc);border:4px solid #fff;box-shadow:0 2px 10px rgba(194,69,106,.5);cursor:pointer}

/* ---------- anillo de carga ---------- */
#hana .h-ring{width:160px;height:160px;margin:10px auto 0;position:relative}
#hana .h-ring svg{transform:rotate(-90deg)}
#hana .h-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:var(--plum)}
#hana .h-steps{margin-top:26px;display:flex;flex-direction:column;gap:13px}
#hana .h-step{display:flex;align-items:center;gap:11px;font-size:15px;color:var(--gray);transition:color .3s}
#hana .h-step .ic{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;transition:all .3s}
#hana .h-step.h-done{color:var(--ink);font-weight:600}
#hana .h-step.h-done .ic{background:var(--ok);border-color:var(--ok)}

/* ---------- IMC ---------- */
#hana .h-imc{margin-top:22px}
#hana .h-imc .bar{height:16px;border-radius:10px;display:flex;overflow:hidden}
#hana .h-imc .bar span{flex:1}
#hana .h-imc .bar .b1{background:#7cc4f0}
#hana .h-imc .bar .b2{background:#4caf6a}
#hana .h-imc .bar .b3{background:#f0b84c}
#hana .h-imc .bar .b4{background:#e0614e}
#hana .h-imc .track{position:relative;height:30px;margin-top:4px}
#hana .h-imc .mark{position:absolute;top:0;transform:translateX(-50%);text-align:center;transition:left .6s ease}
#hana .h-imc .mark .pin{width:3px;height:14px;background:var(--ink);margin:0 auto;border-radius:2px}
#hana .h-imc .mark .lbl{font-size:11px;font-weight:800;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:2px 7px;margin-top:3px;white-space:nowrap}
#hana .h-imc .legend{display:flex;justify-content:space-between;font-size:10px;color:var(--gray);margin-top:6px}
#hana .h-cards{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:20px}
#hana .h-card{background:var(--soft);border-radius:14px;padding:13px}
#hana .h-card .k{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--gray)}
#hana .h-card .v{font-size:16px;font-weight:800;color:var(--plum);margin-top:3px;line-height:1.2}

/* ---------- ruleta ---------- */
#hana .h-wheelwrap{position:relative;width:280px;height:280px;margin:18px auto 0}
#hana .h-wheel{
  width:100%;height:100%;border-radius:50%;position:relative;
  border:8px solid #fff;box-shadow:0 10px 30px rgba(74,42,79,.25),0 0 0 4px var(--acc);
  transition:transform 5s cubic-bezier(.12,.8,.12,1);
}
#hana .h-wheel .seg{
  position:absolute;inset:0;display:flex;justify-content:center;
  font-size:10.5px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)
}
#hana .h-wheel .seg span{
  margin-top:20px;width:70px;text-align:center;transform-origin:center;line-height:1.1
}
#hana .h-hub{
  position:absolute;top:50%;left:50%;width:54px;height:54px;transform:translate(-50%,-50%);
  background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:26px;box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:3
}
#hana .h-point{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);z-index:4;
  width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;
  border-top:22px solid var(--acc);filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))
}
#hana .h-win{
  background:var(--soft);border:2px solid var(--acc);border-radius:18px;padding:18px;
  margin-top:22px;text-align:center;animation:hIn .4s ease both
}
#hana .h-win .big{font-size:24px;font-weight:900;color:var(--acc)}
#hana .h-confetti{position:fixed;inset:0;pointer-events:none;z-index:999;overflow:hidden}
#hana .h-confetti i{position:absolute;width:9px;height:14px;top:-20px;border-radius:2px;animation:hFall linear forwards}
@keyframes hFall{to{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* ---------- oferta ---------- */
#hana .h-offer section{margin-top:30px}
#hana .h-video{
  width:100%;max-width:300px;margin:16px auto 0;aspect-ratio:9/16;background:var(--plum);
  border-radius:20px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff
}
#hana .h-video video{width:100%;height:100%;object-fit:cover}
#hana .h-price{
  background:linear-gradient(180deg,#fff,var(--soft));border:2px solid var(--acc);
  border-radius:20px;padding:22px;text-align:center;margin-top:16px
}
#hana .h-price .old{font-size:17px;color:var(--gray);text-decoration:line-through}
#hana .h-price .new{font-size:44px;font-weight:900;color:var(--acc);line-height:1;margin-top:4px}
#hana .h-price .meta{font-size:13px;color:var(--plum);margin-top:8px;font-weight:600}
#hana .h-price .safe{font-size:12px;color:var(--gray);margin-top:6px}
#hana .h-buy{
  background:var(--acc);color:#fff;border:none;border-radius:14px;padding:16px;
  font-size:17px;font-weight:800;width:100%;margin-top:14px;cursor:pointer;min-height:54px;
  box-shadow:0 6px 18px rgba(194,69,106,.4);text-decoration:none;display:block;text-align:center
}
#hana .h-buy:active{transform:scale(.99)}
#hana .h-receive{display:flex;flex-direction:column;gap:14px;margin-top:16px}
#hana .h-receive .r{display:flex;gap:12px;align-items:flex-start}
#hana .h-receive .r .i{font-size:22px;flex:0 0 auto}
#hana .h-receive .r .t{font-size:14.5px;line-height:1.4}
#hana .h-steps3{display:flex;flex-direction:column;gap:12px;margin-top:16px}
#hana .h-steps3 .s{display:flex;gap:12px;align-items:center;background:var(--soft);border-radius:14px;padding:13px}
#hana .h-steps3 .s .n{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#hana .h-bonus{display:flex;flex-direction:column;gap:11px;margin-top:16px}
#hana .h-bonus .b{display:flex;gap:12px;align-items:center;border:2px solid var(--line);border-radius:14px;padding:13px}
#hana .h-bonus .b .m{width:48px;height:48px;border-radius:10px;background:var(--soft);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:24px}
#hana .h-guar{text-align:center;background:#eaf6ef;border-radius:18px;padding:22px;margin-top:16px}
#hana .h-guar .seal{width:70px;height:70px;border-radius:50%;background:#fff;border:3px solid var(--ok);display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 10px}
#hana .h-check{display:flex;flex-direction:column;gap:14px;margin-top:16px}
#hana .h-check .c .wk{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--acc)}
#hana .h-check .c .d{font-size:14.5px;margin-top:3px;display:flex;gap:8px;align-items:flex-start}
#hana .h-faq{margin-top:12px}
#hana .h-faq .q{border-bottom:1px solid var(--line);padding:15px 0;cursor:pointer}
#hana .h-faq .q .qh{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700;font-size:15px}
#hana .h-faq .q .qh .pm{color:var(--acc);font-size:22px;transition:transform .2s;flex:0 0 auto}
#hana .h-faq .q .a{max-height:0;overflow:hidden;transition:max-height .25s ease;font-size:14px;color:var(--gray);line-height:1.5}
#hana .h-faq .q.h-open .a{max-height:240px;margin-top:10px}
#hana .h-faq .q.h-open .pm{transform:rotate(45deg)}
#hana .h-legal{font-size:11px;color:var(--gray);line-height:1.5;margin-top:24px;text-align:center}

/* ---------- testimonios ---------- */
#hana .h-testis{margin-top:30px}
#hana .h-trow{display:flex;flex-direction:column;gap:12px;margin-top:14px}
#hana .h-trow.h-tcar{flex-direction:row;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:8px;gap:12px}
#hana .h-trow.h-tcar .h-testi{min-width:82%;scroll-snap-align:start;flex:0 0 auto}
#hana .h-testi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 3px 12px rgba(74,42,79,.06)}
#hana .h-testi.h-tfeat{background:var(--soft);border-color:var(--acc)}
#hana .h-thead{display:flex;align-items:center;gap:11px}
#hana .h-tav{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto}
#hana .h-tini{background:var(--acc);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px}
#hana .h-tinfo{min-width:0}
#hana .h-tname{font-weight:800;font-size:15px;color:var(--plum)}
#hana .h-tverif{color:var(--ok);font-size:11px;font-weight:700}
#hana .h-tmeta{font-size:12px;color:var(--gray)}
#hana .h-tstars{color:#f5b301;font-size:15px;letter-spacing:2px;margin-top:9px}
#hana .h-ttext{font-size:14px;line-height:1.5;margin-top:9px;color:var(--ink)}
#hana .h-tload{margin-top:22px;text-align:left}

/* ---------- plazas ---------- */
#hana .h-plazas{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:13px 15px;margin-bottom:16px}
#hana .h-ptxt{font-size:13.5px;font-weight:700;color:var(--plum);text-align:center}
#hana .h-ptxt b{color:var(--acc);font-size:16px}
#hana .h-pbar{height:10px;border-radius:8px;background:#efd9e0;overflow:hidden;margin-top:9px}
#hana .h-pbar i{display:block;height:100%;background:linear-gradient(90deg,#c2456a,#e0614e);border-radius:8px;transition:width .6s ease}

/* ---------- footer CTA ---------- */
#hana .h-foot{
  position:fixed;left:0;right:0;bottom:0;z-index:40;max-width:560px;margin:0 auto;
  padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,255,255,0),#fff 32%);
  pointer-events:none;
}
#hana .h-cta{
  pointer-events:auto;width:100%;background:var(--acc);color:#fff;border:none;
  border-radius:16px;padding:17px;font-size:17px;font-weight:800;cursor:pointer;
  min-height:56px;box-shadow:0 8px 22px rgba(194,69,106,.42);
}
#hana .h-cta:active{transform:scale(.99)}
#hana .h-cta:disabled{opacity:.45;box-shadow:none}

/* cover layout */
#hana .h-cover-top{display:flex;gap:14px;align-items:stretch}
#hana .h-cover-top .l{flex:1;display:flex;flex-direction:column;justify-content:center}
#hana .h-cover-top .r{flex:0 0 42%}
#hana .h-cover-top .r .h-pic{height:100%;aspect-ratio:auto;min-height:200px}
#hana .h-agebtns{display:flex;flex-direction:column;gap:10px;margin-top:16px}
@media(max-width:360px){
  #hana h1{font-size:23px}
  #hana .h-val{font-size:40px}
  #hana .h-wheelwrap{width:250px;height:250px}
}
</style>

<script>
// ====== CONFIG EDITABLE A MANO (cargá vos los datos reales) ======
window.HANA_CONFIG = window.HANA_CONFIG || {
  testimonios: [

        if(u==='cm'){ sr.min=140; sr.max=195; sr.value=S.height; sv.innerHTML=S.height+'<span>cm</span>'; }
        else{ // pies
          var totalIn=Math.round(S.height/2.54);
          var ft=Math.floor(totalIn/12), inch=totalIn%12;
          sr.min=140; sr.max=195; sr.value=S.height;
          sv.innerHTML=ft+"'"+inch+'"<span></span>';
        }
      }else{
        if(u==='kg'){ sr.min=40; sr.max=150; sr.value=S[key]; sv.innerHTML=S[key]+'<span>kg</span>'; }
        else{ sr.min=40; sr.max=150; sr.value=S[key]; sv.innerHTML=Math.round(S[key]*2.205)+'<span>lb</span>'; }
      }
    }
    sr.min=conf.min; sr.max=conf.max; sr.step=conf.step; sr.value=cur();
    draw();
    sr.addEventListener('input',function(){ S[key]=parseInt(sr.value,10); draw(); });
    Array.prototype.forEach.call(uBtns,function(ub){
      ub.addEventListener('click',function(){
        Array.prototype.forEach.call(uBtns,function(x){x.classList.remove('h-on');});
        ub.classList.add('h-on');
        S[unitKey]= ub.dataset.u==='0' ? s.units[0] : s.units[1];
        // normaliza clave de unidad a métrica/imperial reconocible
        if(key==='height') S.hUnit = ub.dataset.u==='0'?'cm':'pies';
        else S[unitKey]= ub.dataset.u==='0'?'kg':'lb';
        draw();
      });
    });
    showCta('Continuar', next);
  }

    var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    (function tick(){
      var p=Math.min(1,(Date.now()-t0)/dur);
      var e= reduce?1:p;
      ring.style.strokeDashoffset = 440*(1-e);
      pct.textContent=Math.round(e*100)+'%';
      var si=Math.min(stps.length, Math.floor(e*stps.length+0.001));
      for(var i=0;i<stps.length;i++) stps[i].classList.toggle('h-done', i<si);
      if(p<1 && !reduce){ requestAnimationFrame(tick); }
      else{ for(var j=0;j<stps.length;j++) stps[j].classList.add('h-done'); setTimeout(next, 500); }
    })();
  }

  // ---------- ruleta ----------
  function renderWheel(w){

    var labels=['Rutina express','5% OFF','Guía de sueño','10% OFF','Calendario','25% OFF 🎁'];
    var colors=['#f6c9d6','#e59ab0','#f6c9d6','#e59ab0','#f6c9d6','#c2456a'];
    var cg=[]; for(var i=0;i<6;i++){ cg.push(colors[i]+' '+(i*60)+'deg '+((i+1)*60)+'deg'); }
    var segHtml='';
    for(var k=0;k<6;k++){
      var mid=(k*60)+30;
      segHtml+='<div class="seg" style="transform:rotate('+mid+'deg)"><span>'+labels[k]+'</span></div>';
    }
    w.innerHTML=
      '<h1 class="h-center">🎁 ¡Completaste el test!</h1>'+
      '<p class="h-sub h-center">Gira la ruleta y descubre tu regalo de bienvenida.</p>'+
      '<div class="h-wheelwrap">'+
        '<div class="h-point"></div>'+
        '<div class="h-wheel" id="hWheel" style="background:conic-gradient('+cg.join(',')+')">'+segHtml+'</div>'+
        '<div class="h-hub">🌸</div>'+
      '</div>'+
      '<div id="hWheelOut"></div>';
    showCta('Girar la ruleta', spin);
    var spun=false;
    function spin(){
      if(spun) return; spun=true;
      cta.disabled=true;
      var wheel=w.querySelector('#hWheel');
      // premio seg5 centro=330deg -> para llevarlo arriba: 360-330=30, +6 vueltas
      var target=360*6 + 30;
      var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
      if(reduce){ wheel.style.transition='none'; }
      wheel.style.transform='rotate('+target+'deg)';
      setTimeout(win, reduce?50:5100);
    }
    function win(){
      px('WheelWin');
      try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){}
      confetti();
      var out=w.querySelector('#hWheelOut');
      out.innerHTML='<div class="h-win"><div class="big">¡Ganaste! 25% OFF 🎁</div>'+
        '<p style="font-size:14px;margin-top:6px;color:var(--plum)">+ rutina express de 7 minutos · guía de sueño · calendario imprimible.</p>'+
        '<p style="font-size:15px;font-weight:700;margin-top:10px;color:var(--acc)">🎉 Felicitaciones por el premio mayor</p></div>';
      showCta('Ver mi plan con descuento →', function(){ startTimer(); next(); });
      cta.disabled=false;
    }
  }
  function confetti(){
    var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(reduce) return;
    var box=document.createElement('div'); box.className='h-confetti'; root.appendChild(box);
    var cs=['#c2456a','#4a2a4f','#f0b84c','#2f8a5b','#e59ab0'];
    for(var i=0;i<90;i++){
      var p=document.createElement('i');
      p.style.left=Math.random()*100+'%';
      p.style.background=cs[i%cs.length];
      p.style.animationDuration=(1.6+Math.random())+'s';
      p.style.animationDelay=(Math.random()*0.5)+'s';
      p.style.transform='rotate('+(Math.random()*360)+'deg)';
      box.appendChild(p);
    }
    setTimeout(function(){ box.remove(); },2600);
  }

  // ---------- temporizador ----------
  var DEADLINE_KEY='hana_deadline', DUR=900000; // 15 min
  function startTimer(){
    try{
      if(!sessionStorage.getItem(DEADLINE_KEY))
        sessionStorage.setItem(DEADLINE_KEY, String(Date.now()+DUR));
    }catch(e){}
  }
  function deadline(){
    try{ var v=sessionStorage.getItem(DEADLINE_KEY); return v?parseInt(v,10):(Date.now()+DUR); }
    catch(e){ return Date.now()+DUR; }
  }
  var timerInt=null;
  function runTimer(){
    var clock=document.getElementById('hClock');
    var txt=document.getElementById('hUrgText');
    if(timerInt) clearInterval(timerInt);
    function upd(){
      var left=deadline()-Date.now();
      if(left<=0){
        urg.classList.add('h-exp');
        if(txt) txt.innerHTML='Tu descuento de la ruleta venció';
        applyExpired(true);
        clearInterval(timerInt); timerInt=null;
        return;
      }
      var s=Math.floor(left/1000), m=Math.floor(s/60), ss=s%60;
      if(clock) clock.textContent=m+':'+(ss<10?'0':'')+ss;
    }
    upd(); timerInt=setInterval(upd,1000);
  }

    var bp=basePrice();

    var link= exp ? '/checkout' : '/checkout?cupon=HANA25';
    var btnTxt= exp ? 'Quiero mi plan' : 'Quiero mi plan con 25% OFF';
    // precios
    Array.prototype.forEach.call(document.querySelectorAll('#hana .h-price'),function(pb){
      var oldEl=pb.querySelector('.old'), newEl=pb.querySelector('.new');
      if(exp){ if(oldEl)oldEl.style.display='none'; if(newEl)newEl.textContent=full; }
      else{ if(oldEl){oldEl.style.display='';oldEl.textContent=full;} if(newEl)newEl.textContent=disc; }
    });
    // botones compra
    Array.prototype.forEach.call(document.querySelectorAll('#hana .h-buy'),function(b){ b.setAttribute('href',link); });
    // cta fijo
    cta.textContent=btnTxt;
    cta.onclick=function(){ px('ClickCheckout'); location.href=link; };
  }

    runTimer();
  }

    return '<section><div class="h-price">'+

})();

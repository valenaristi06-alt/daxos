<style>
/* ===================== SCOPE #hana ===================== */
#hana *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
#hana{
  --acc:#c2456a; --soft:#fbe9ee; --plum:#4a2a4f; --ink:#1d1520;
  --gray:#6f6472; --ok:#2f8a5b; --line:#ecdfe4;
  font-family:'Poppins',system-ui,-apple-system,sans-serif;
  color:var(--ink); background:#fff; max-width:560px; margin:0 auto;
  position:relative; min-height:100dvh; display:flex; flex-direction:column;
  overflow-x:hidden;
}
#hana button{font-family:inherit}
#hana img{display:block;max-width:100%}

/* ---------- header ---------- */
#hana .h-header{
  position:sticky; top:0; z-index:30; background:rgba(255,255,255,.96);
  backdrop-filter:blur(6px); display:flex; align-items:center; gap:10px;
  padding:10px 14px 0; border-bottom:1px solid var(--line);
}
#hana .h-back{
  width:38px;height:38px;border:none;background:none;color:var(--plum);
  display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
  border-radius:50%;
}
#hana .h-back:active{background:var(--soft)}
#hana .h-back[hidden]{visibility:hidden}
#hana .h-brand{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1}
#hana .h-logo{font-weight:900;font-size:20px;letter-spacing:3px;color:var(--plum)}
#hana .h-tag{font-size:9.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--gray);margin-top:2px}
#hana .h-header .h-spacer{width:38px;flex:0 0 auto}
#hana .h-progress{
  position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--soft);
}
#hana .h-progress i{
  display:block;height:100%;width:0;background:var(--acc);
  border-radius:0 3px 3px 0;transition:width .45s cubic-bezier(.4,0,.2,1);
}

/* ---------- urgencia ---------- */
#hana .h-urg{
  position:sticky;top:49px;z-index:25;background:var(--plum);color:#fff;
  text-align:center;font-size:13px;font-weight:600;padding:9px 14px;
}
#hana .h-urg b{font-weight:800}
#hana .h-urg.h-exp{background:#7a6a5f}

/* ---------- stage ---------- */
#hana .h-stage{flex:1;padding:18px 18px 120px;position:relative}
#hana .h-screen{animation:hIn .32s ease both}
@keyframes hIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  #hana .h-screen{animation:none}
  #hana .h-progress i{transition:none}
}

#hana h1{font-size:26px;font-weight:900;line-height:1.15;letter-spacing:-.4px}
#hana h2{font-size:22px;font-weight:800;line-height:1.2;letter-spacing:-.3px}
#hana .h-acc{color:var(--acc)}
#hana .h-kicker{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:8px}
#hana .h-sub{color:var(--gray);font-size:14.5px;line-height:1.5;margin-top:8px}
#hana .h-center{text-align:center}

/* imagen genérica (fondo rosa si falla) */
#hana .h-pic{
  width:100%;background:var(--soft);border-radius:20px;overflow:hidden;position:relative;
  aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;margin:0 auto;
}
#hana .h-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#hana .h-pic.h-por{aspect-ratio:3/4;max-width:260px}
#hana .h-pic.h-sq{aspect-ratio:1/1}

/* ---------- opciones ---------- */
#hana .h-opts{display:flex;flex-direction:column;gap:11px;margin-top:20px}
#hana .h-opt{
  display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:15px 15px;min-height:60px;cursor:pointer;font-size:16px;font-weight:600;
  color:var(--ink);transition:border-color .15s,background .15s,transform .08s;
}

  // ---------- navegación ----------
  function setProgress(){

    bar.style.width = p+'%';
  }
  function go(n){
    if(n<0||n>=SCR.length) return;
    idx=n;
    back.hidden = (idx===0);
    urg.hidden = (idx!==OFFER_IDX);
    foot.hidden = true;
    setProgress();
    stage.innerHTML='';
    render(SCR[idx]);
    try{ window.scrollTo(0,0); }catch(e){}
    stage.scrollTop=0;
    if(idx===LOADER_IDX) px('QuizComplete');
    if(idx===OFFER_IDX) px('ViewOffer');
  }
  function next(){ go(idx+1); }
  back.addEventListener('click', function(){ if(idx>0) go(idx-1); });

    if(T==='intensity') return renderIntensity(w);
    if(T==='graph') return renderGraph(w);

          s.opts.forEach(function(oo,j){ if(oo[2]==='excl'&&sel[j]){ delete sel[j]; box.children[j].classList.remove('h-on'); }});
          if(sel[i]){ delete sel[i]; b.classList.remove('h-on'); }

  // ---------- slider ----------
  function renderSlider(w,s){
    var key=s.key;
    var unitKey = key==='height'?'hUnit':(key==='weight'?'wUnit':'tUnit');
    w.innerHTML=
      '<h1>'+s.title+'</h1>'+
      '<div class="h-slider">'+
        '<div class="h-units"><button data-u="0" class="h-on">'+s.units[0]+'</button><button data-u="1">'+s.units[1]+'</button></div>'+
        '<div class="h-val" id="hSv"></div>'+
        '<input class="h-range" type="range" id="hSr">'+
      '</div>';
    var sv=w.querySelector('#hSv'), sr=w.querySelector('#hSr');
    var uBtns=w.querySelectorAll('.h-units button');

    // rangos base en unidad métrica
    var conf = key==='height'
      ? {min:140,max:195,step:1, m2i:function(v){return v;}, metric:'cm'}
      : {min:40, max:150,step:1, m2i:function(v){return v;}, metric:'kg'};

    function cur(){ return S[key]; } // valor en métrica
    function draw(){
      var u=S[unitKey];
      if(key==='height'){
        if(u==='cm'){ sr.min=140; sr.max=195; sr.value=S.height; sv.innerHTML=S.height+'<span>cm</span>'; }
        else{ // pies
          var totalIn=Math.round(S.height/2.54);
          var ft=Math.floor(totalIn/12), inch=totalIn%12;
          sr.min=140; sr.max=195; sr.value=S.height;
          sv.innerHTML=ft+"'"+inch+'"<span></span>';
        }
      }else{
        if(u==='kg'){ sr.min=40; sr.max=150; sr.value=S[key]; sv.innerHTML=S[key]+'<span>kg</span>'; }
        else{ sr.min=40; sr.max=150; sr.value=S[key]; sv.innerHTML=Math.round(S[key]*2.205)+'<span>lb</span>'; }
      }
    }
    sr.min=conf.min; sr.max=conf.max; sr.step=conf.step; sr.value=cur();
    draw();
    sr.addEventListener('input',function(){ S[key]=parseInt(sr.value,10); draw(); });
    Array.prototype.forEach.call(uBtns,function(ub){
      ub.addEventListener('click',function(){
        Array.prototype.forEach.call(uBtns,function(x){x.classList.remove('h-on');});
        ub.classList.add('h-on');
        S[unitKey]= ub.dataset.u==='0' ? s.units[0] : s.units[1];
        // normaliza clave de unidad a métrica/imperial reconocible
        if(key==='height') S.hUnit = ub.dataset.u==='0'?'cm':'pies';
        else S[unitKey]= ub.dataset.u==='0'?'kg':'lb';
        draw();
      });
    });
    showCta('Continuar', next);
  }

      '<div class="pct" id="hPct">0%</div></div>'+
      '<div class="h-steps" id="hStps">'+steps.map(function(t){return '<div class="h-step"><span class="ic">'+chkmark+'</span><span>'+t+'</span></div>';}).join('')+'</div>'+
      (TESTI.length?'<div class="h-tload">'+testiCard(TESTI[0],true)+'</div>':'');
    foot.hidden=true;
    var ring=w.querySelector('#hRingC'), pct=w.querySelector('#hPct');
    var stps=w.querySelectorAll('.h-step');
    var t0=Date.now(), dur=6000;
    var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    (function tick(){
      var p=Math.min(1,(Date.now()-t0)/dur);
      var e= reduce?1:p;
      ring.style.strokeDashoffset = 440*(1-e);
      pct.textContent=Math.round(e*100)+'%';
      var si=Math.min(stps.length, Math.floor(e*stps.length+0.001));
      for(var i=0;i<stps.length;i++) stps[i].classList.toggle('h-done', i<si);
      if(p<1 && !reduce){ requestAnimationFrame(tick); }
      else{ for(var j=0;j<stps.length;j++) stps[j].classList.add('h-done'); setTimeout(next, 500); }
    })();
  }

  // ---------- graph2 (comparación) ----------
  function renderGraph2(w){
    w.innerHTML=
      '<h1>¡Tu protocolo está casi listo!</h1>'+
      '<p class="h-sub">Tu plan avanza con una progresión suave. Empezar sin guía suele estancarse.</p>'+
      '<div style="margin-top:20px;background:var(--soft);border-radius:18px;padding:18px 14px 12px">'+
      '<svg viewBox="0 0 300 160" width="100%" height="160" aria-hidden="true">'+
        '<path d="M15,140 C90,120 170,70 285,25" fill="none" stroke="#c2456a" stroke-width="4" stroke-linecap="round"/>'+
        '<path d="M15,140 C110,135 200,128 285,118" fill="none" stroke="#b9acbf" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>'+
        '<circle cx="285" cy="25" r="6" fill="#c2456a"/><circle cx="285" cy="118" r="5" fill="#b9acbf"/>'+
      '</svg>'+
      '<div style="display:flex;gap:16px;justify-content:center;font-size:12px;margin-top:4px;font-weight:600">'+
      '<span style="color:var(--acc)">● Tu plan Hana</span><span style="color:#b9acbf">● Sin guía</span></div>'+
      '</div>'+
      '<div class="h-box">Tu plan de 21 días está casi listo.</div>';
    showCta('Continuar →', next);
  }

  // ---------- imc ----------
  function imcVal(){
    var h=S.height/100; var v=S.weight/(h*h);
    return Math.round(v*10)/10;
  }
  function renderImc(w){
    var v=imcVal();
    // posición 15..40 -> 0..100
    var pos=Math.max(0,Math.min(100,((v-15)/(40-15))*100));
    var en=['Agotada','Variable','Muy activa'][S.energy]||'Variable';
    var zonas = (S.zones||[]).length ? SCR[8].opts.filter(function(_,i){return S.zones.indexOf(i)>-1;}).map(function(o){return o[1];}).join(', ') : 'Cuerpo completo';
    var cuid = (S.pain||[]).length ? SCR[18].opts.filter(function(_,i){return S.pain.indexOf(i)>-1;}).map(function(o){return o[1];}).join(', ') : 'Ninguna';
    if(cuid==='Ninguna' && (S.pain||[]).indexOf(3)>-1) cuid='Prevención general';
    w.innerHTML=
      '<h1>Tu perfil está listo</h1>'+
      '<div class="h-imc">'+
        '<div class="bar"><span class="b1"></span><span class="b2"></span><span class="b3"></span><span class="b4"></span></div>'+
        '<div class="track"><div class="mark" style="left:'+pos+'%"><div class="pin"></div><div class="lbl">Tú: '+String(v).replace('.',',')+'</div></div></div>'+
        '<div class="legend"><span>Bajo</span><span>Normal</span><span>Sobrepeso</span><span>Obesidad</span></div>'+
      '</div>'+
      '<div class="h-cards">'+
        card('Energía',en)+card('Tipo de cuerpo',S.biotipo||'—')+
        card('Zonas foco',zonas)+card('Zonas que cuidamos',cuid)+
      '</div>'+
      '<div class="h-card" style="margin-top:11px"><div class="k">Potencial de mejora</div><div class="v" style="color:var(--ok)">Alto</div></div>'+
      '<div class="h-note">El IMC es una referencia general; no mide músculo ni grasa.</div>';
    showCta('Continuar', next);
  }
  function card(k,v){ return '<div class="h-card"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

  // ---------- commit ----------
  function renderCommit(w){
    var d=new Date(); d.setDate(d.getDate()+28);
    var fecha=d.toLocaleDateString('es-MX',{day:'numeric',month:'long'});
    w.innerHTML=
      '<h1>¿Qué tan segura estás de ponerte en forma antes del '+fecha+'?</h1>'+
      '<div class="h-opts"></div>';
    var box=w.querySelector('.h-opts');
    [['💪','¡Muy segura!'],['🙂','Dispuesta a probar algo nuevo'],['🤞','No sé, pero quiero intentarlo']].forEach(function(o,i){
      var b=el('<button class="h-opt" type="button"><span class="h-emo">'+o[0]+'</span><span class="h-txt">'+o[1]+'</span>'+arw+'</button>');
      b.addEventListener('click',function(){ S.confidence=i; pick(b,w,next); });
      box.appendChild(b);
    });
  }

  // ---------- ruleta ----------
  function renderWheel(w){
    // segmentos (desde arriba, en sentido horario) — premio = índice 5 (25% OFF)
    var labels=['Rutina express','5% OFF','Guía de sueño','10% OFF','Calendario','25% OFF 🎁'];
    var colors=['#f6c9d6','#e59ab0','#f6c9d6','#e59ab0','#f6c9d6','#c2456a'];
    var cg=[]; for(var i=0;i<6;i++){ cg.push(colors[i]+' '+(i*60)+'deg '+((i+1)*60)+'deg'); }
    var segHtml='';
    for(var k=0;k<6;k++){
      var mid=(k*60)+30;
      segHtml+='<div class="seg" style="transform:rotate('+mid+'deg)"><span>'+labels[k]+'</span></div>';
    }
    w.innerHTML=
      '<h1 class="h-center">🎁 ¡Completaste el test!</h1>'+
      '<p class="h-sub h-center">Gira la ruleta y descubre tu regalo de bienvenida.</p>'+
      '<div class="h-wheelwrap">'+
        '<div class="h-point"></div>'+
        '<div class="h-wheel" id="hWheel" style="background:conic-gradient('+cg.join(',')+')">'+segHtml+'</div>'+
        '<div class="h-hub">🌸</div>'+
      '</div>'+
      '<div id="hWheelOut"></div>';
    showCta('Girar la ruleta', spin);
    var spun=false;
    function spin(){
      if(spun) return; spun=true;
      cta.disabled=true;
      var wheel=w.querySelector('#hWheel');
      // premio seg5 centro=330deg -> para llevarlo arriba: 360-330=30, +6 vueltas
      var target=360*6 + 30;
      var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
      if(reduce){ wheel.style.transition='none'; }
      wheel.style.transform='rotate('+target+'deg)';
      setTimeout(win, reduce?50:5100);
    }
    function win(){
      px('WheelWin');
      try{ if(navigator.vibrate) navigator.vibrate(60); }catch(e){}
      confetti();
      var out=w.querySelector('#hWheelOut');
      out.innerHTML='<div class="h-win"><div class="big">¡Ganaste! 25% OFF 🎁</div>'+
        '<p style="font-size:14px;margin-top:6px;color:var(--plum)">+ rutina express de 7 minutos · guía de sueño · calendario imprimible.</p>'+
        '<p style="font-size:15px;font-weight:700;margin-top:10px;color:var(--acc)">🎉 Felicitaciones por el premio mayor</p></div>';
      showCta('Ver mi plan con descuento →', function(){ startTimer(); next(); });
      cta.disabled=false;
    }
  }
  function confetti(){
    var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
    if(reduce) return;
    var box=document.createElement('div'); box.className='h-confetti'; root.appendChild(box);
    var cs=['#c2456a','#4a2a4f','#f0b84c','#2f8a5b','#e59ab0'];
    for(var i=0;i<90;i++){
      var p=document.createElement('i');
      p.style.left=Math.random()*100+'%';
      p.style.background=cs[i%cs.length];
      p.style.animationDuration=(1.6+Math.random())+'s';
      p.style.animationDelay=(Math.random()*0.5)+'s';
      p.style.transform='rotate('+(Math.random()*360)+'deg)';
      box.appendChild(p);
    }
    setTimeout(function(){ box.remove(); },2600);
  }

  // ---------- temporizador ----------
  var DEADLINE_KEY='hana_deadline', DUR=900000; // 15 min
  function startTimer(){
    try{
      if(!sessionStorage.getItem(DEADLINE_KEY))
        sessionStorage.setItem(DEADLINE_KEY, String(Date.now()+DUR));
    }catch(e){}
  }
  function deadline(){
    try{ var v=sessionStorage.getItem(DEADLINE_KEY); return v?parseInt(v,10):(Date.now()+DUR); }
    catch(e){ return Date.now()+DUR; }
  }
  var timerInt=null;
  function runTimer(){
    var clock=document.getElementById('hClock');
    var txt=document.getElementById('hUrgText');
    if(timerInt) clearInterval(timerInt);
    function upd(){
      var left=deadline()-Date.now();
      if(left<=0){
        urg.classList.add('h-exp');
        if(txt) txt.innerHTML='Tu descuento de la ruleta venció';
        applyExpired(true);
        clearInterval(timerInt); timerInt=null;
        return;
      }
      var s=Math.floor(left/1000), m=Math.floor(s/60), ss=s%60;
      if(clock) clock.textContent=m+':'+(ss<10?'0':'')+ss;
    }
    upd(); timerInt=setInterval(upd,1000);
  }

  // ---------- oferta ----------
  var DISCOUNT=0.25;
  function applyExpired(exp){
    var bp=basePrice();
    var full=fmt(bp.n,bp.pref);
    var disc=fmt(bp.n*(1-DISCOUNT),bp.pref);
    var link= exp ? '/checkout' : '/checkout?cupon=HANA25';
    var btnTxt= exp ? 'Quiero mi plan' : 'Quiero mi plan con 25% OFF';
    // precios
    Array.prototype.forEach.call(document.querySelectorAll('#hana .h-price'),function(pb){
      var oldEl=pb.querySelector('.old'), newEl=pb.querySelector('.new');
      if(exp){ if(oldEl)oldEl.style.display='none'; if(newEl)newEl.textContent=full; }
      else{ if(oldEl){oldEl.style.display='';oldEl.textContent=full;} if(newEl)newEl.textContent=disc; }
    });
    // botones compra
    Array.prototype.forEach.call(document.querySelectorAll('#hana .h-buy'),function(b){ b.setAttribute('href',link); });
    // cta fijo
    cta.textContent=btnTxt;
    cta.onclick=function(){ px('ClickCheckout'); location.href=link; };
  }

      ['¿Sirve si nunca hice ejercicio?','Sí. El plan arranca desde cero, con movimientos lentos y una versión más fácil de cada ejercicio.'],
      ['¿Necesito equipo?','No. Solo tu cuerpo y, si quieres, una silla para apoyarte. Entrenas en casa.'],
      ['¿Es seguro con dolor de rodillas o espalda?','El plan se adapta para cuidar esas zonas. Si tienes una lesión, consulta primero a tu médico.'],
      ['¿Es un pago único?','Sí, un solo pago. Sin suscripción ni cobros automáticos.'],
      ['¿Funciona en mi celular?','Sí. Abres la app desde el navegador de tu celular, sin instalar nada complicado.']
    ];
    var receive=[
      ['📱','App Método Hana con tu plan de 21 días armado según tus respuestas.'],
      ['🧘‍♀️','24 ejercicios sin impacto, cada uno con demostración animada y versión más fácil.'],
      ['🦵','Adaptación automática si tienes molestias de rodillas o zona lumbar.'],
      ['🌿','Días de movilidad suave (7, 14 y 21) para recuperar.'],
      ['⏱️','Rutinas de 10, 15 o 20 minutos, según tu tiempo.'],
      ['✅','Seguimiento de días completados en tu celular.']
    ];
    var bonos=[['🏃‍♀️','Rutina express de 7 minutos'],['🌙','Guía de sueño profundo después de los 40'],['🗓️','Calendario imprimible de 21 días']];

    w.className='h-screen h-offer';
    w.innerHTML=
      plazasBlock()+
      '<h1>¡Tu plan de Calistenia Asiática está listo!</h1>'+
      '<p class="h-sub">Mira cómo funciona:</p>'+
      '<div class="h-video"><video src="'+((typeof window!=="undefined"&&window.HANA_VIDEO)||"video/demo.mp4")+'" autoplay muted loop playsinline controls onerror="this.parentNode.innerHTML=\'📱 Vista previa de la app\'"></video></div>'+
      '<a class="h-buy" href="/checkout?cupon=HANA25">Obtener mi plan personalizado →</a>'+

      '<section><h2>Lo que vas a recibir</h2><div class="h-receive">'+
      receive.map(function(r){return '<div class="r"><span class="i">'+r[0]+'</span><span class="t">'+r[1]+'</span></div>';}).join('')+
      '</div></section>'+

      '<section class="h-center"><h2>¡App fácil de usar y hecha para principiantes!</h2>'+pic('app-mockup.webp','h-por','📱')+'</section>'+

      testiBlock()+

      priceBlock(bp)+

      '<section><h2>Cómo funciona en 3 pasos</h2><div class="h-steps3">'+
      [['1','Haces el test'],['2','Recibes tu plan en la app'],['3','15 minutos al día']].map(function(s){return '<div class="s"><span class="n">'+s[0]+'</span><span>'+s[1]+'</span></div>';}).join('')+
      '</div></section>'+

      priceBlock(bp)+

      '<section><h2>🎁 + Bonos incluidos hoy</h2><div class="h-bonus">'+
      bonos.map(function(b){return '<div class="b"><span class="m">'+b[0]+'</span><span>'+b[1]+'</span></div>';}).join('')+
      '</div></section>'+

      '<div class="h-guar"><div class="seal">🛡️</div><h2>Garantía de 7 días</h2>'+
      '<p class="h-sub">Si el plan no es para ti, escribes dentro de los 7 días y te devolvemos el dinero.</p></div>'+

      '<section><h2>Qué esperar en tus 21 días</h2><div class="h-check">'+
      [['Semana 1','Movilidad y respiración'],['Semana 2','Fuerza de piernas y abdomen'],['Semana 3','Tono y postura']].map(function(c){
        return '<div class="c"><div class="wk">'+c[0]+'</div><div class="d">✅ <span>'+c[1]+'</span></div></div>';}).join('')+
      '</div></section>'+

      '<section><h2>Preguntas frecuentes</h2><div class="h-faq">'+
      faqs.map(function(f){return '<div class="q"><div class="qh">'+f[0]+'<span class="pm">+</span></div><div class="a">'+f[1]+'</div></div>';}).join('')+
      '</div></section>'+

      priceBlock(bp)+

      '<div class="h-legal">Contenido educativo. No reemplaza la indicación de tu médico. Los resultados varían según cada persona.</div>';

    // faq acordeón
    Array.prototype.forEach.call(w.querySelectorAll('.h-faq .q'),function(q){
      q.querySelector('.qh').addEventListener('click',function(){ q.classList.toggle('h-open'); });
    });

    // cta fijo + precios + timer
    foot.hidden=false;
    startTimer();
    applyExpired(false);
    runTimer();
  }
  function priceBlock(bp){
    return '<section><div class="h-price">'+
      '<div class="old"></div>'+
      '<div class="new"></div>'+
      '<div class="meta">Pago único • Acceso inmediato</div>'+
      '<div class="safe">🔒 Compra 100% segura • Garantía de 7 días</div>'+
      '<a class="h-buy" href="/checkout?cupon=HANA25">Quiero mi plan con 25% OFF</a>'+
      '</div></section>';
  }

  // ---------- init ----------
  go(0);
})();
</script>

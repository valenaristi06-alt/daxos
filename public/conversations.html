<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logodaxosnaranjanofondo.png">
  <link rel="apple-touch-icon" href="/logodaxosnaranjanofondo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversaciones — Daxos</title>
  <link rel="stylesheet" href="/dashboard.css" />
  <style>
    .btn-pause-toggle {
      font-size: 12px;
      font-family: var(--mono, monospace);
      padding: 4px 10px;
      border: 1px solid #3a3a3a;
      border-radius: 4px;
      background: transparent;
      color: var(--muted, #888);
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-pause-toggle:hover { border-color: var(--accent, #C45C1A); color: var(--accent, #C45C1A); }

    .needs-human-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 16px;
      background: rgba(196,92,26,0.08);
      border-top: 1px solid rgba(196,92,26,0.2);
      font-size: 13px;
      color: var(--muted-2, #888);
      flex-wrap: wrap;
    }

    .panel-reply-box {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-top: 1px solid #1e1e1e;
      background: #0f0f0f;
    }
    .panel-reply-textarea {
      flex: 1;
      resize: none;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      color: var(--text, #f0ede8);
      font-size: 13px;
      font-family: var(--sans, system-ui);
      padding: 8px 10px;
      line-height: 1.5;
    }
    .panel-reply-textarea:focus { outline: none; border-color: var(--accent, #C45C1A); }
    .btn-panel-send {
      align-self: flex-end;
      padding: 8px 16px;
      background: var(--accent, #C45C1A);
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-panel-send:disabled { opacity: 0.5; cursor: not-allowed; }

    .conv-tags { display: inline-flex; gap: 3px; flex-wrap: wrap; margin-top: 3px; }
    .conv-tag-chip {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 500;
      white-space: nowrap;
    }
    .tag-filter-chip {
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 10px;
      border: 1px solid #3a3a3a;
      background: transparent;
      color: #888;
      cursor: pointer;
      white-space: nowrap;
      transition: background .12s, color .12s;
    }
    .tag-filter-chip--active {
      background: #2a2a2a;
      color: #f0ede8;
      border-color: #555;
    }
  </style>
</head>
<body>

  <div class="app-layout">

  <aside class="app-sidebar">
    <a href="/inicio.html" class="sidebar-logo">
      <img src="/logodaxosnaranjanofondo.png" alt="" class="logo-img">DAXOS
    </a>
    <div class="sidebar-divider"></div>
    <nav class="sidebar-nav">
      <a href="/inicio.html" class="sidebar-link">
        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 8L8 2L14 8V14H10V10H6V14H2V8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Inicio
      </a>
      <a href="/dashboard.html" class="sidebar-link">
        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="5" cy="4" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="10" cy="8" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="6" cy="12" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        Configuración
      </a>
      <a href="/conversations.html" class="sidebar-link active">
        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 3C2 2 3 1 4 1H12C13 1 14 2 14 3V9C14 10 13 11 12 11H7L4 14V11C3 11 2 10 2 9V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Conversaciones
      </a>
    </nav>
    <div class="sidebar-bottom">
      <span class="sidebar-email" id="user-email"></span>
      <button class="btn-logout" id="btn-logout">Salir</button>
    </div>
  </aside>

  <div class="app-main app-main--full">
    <div class="conv-panels" id="conv-panels">

      <!-- Conv list panel -->
      <aside class="conv-list-panel">
        <div class="conv-list-header">
          <p class="page-terminal">&gt; conversaciones</p>
          <h1 class="conv-list-title">Chats</h1>
        </div>
        <div id="tag-filter-bar" style="display:none; padding:8px 12px 4px; border-bottom:1px solid #1e1e1e; overflow-x:auto; white-space:nowrap;">
          <button class="tag-filter-chip tag-filter-chip--active" data-tag-id="" style="margin-right:4px;">Todos</button>
        </div>
        <div class="conv-list" id="conv-list">
          <div id="conv-skeleton" style="padding:12px 16px;display:flex;flex-direction:column;gap:10px;">
            <div class="skeleton skeleton-line skeleton-line--full" style="height:42px;border-radius:4px"></div>
            <div class="skeleton skeleton-line skeleton-line--full" style="height:42px;border-radius:4px"></div>
            <div class="skeleton skeleton-line skeleton-line--full" style="height:42px;border-radius:4px"></div>
          </div>
        </div>
      </aside>

      <!-- Thread panel -->
      <main class="conv-thread-panel" id="conv-main">
        <div class="conv-empty-state" id="empty-state">
          <p class="empty-terminal">&gt; _</p>
          <p class="empty-title">Seleccioná una conversación</p>
          <p class="empty-sub">o esperá a que tus clientes te escriban.</p>
        </div>
        <div class="thread" id="thread" style="display:none">
          <button class="btn-back" id="btn-back" onclick="backToList()">← Volver a la lista</button>
          <div class="thread-header" id="thread-header"></div>
          <div class="thread-messages" id="thread-messages"></div>
        </div>
      </main>

    </div>
  </div>

  </div><!-- /app-layout -->

  <script>
    (async () => {
      const res = await fetch('/auth/me');
      if (!res.ok) { window.location.href = '/login.html'; return; }
      const { email } = await res.json();
      document.getElementById('user-email').textContent = email;
    })();

    async function doLogout() {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }
    document.getElementById('btn-logout').addEventListener('click', doLogout);
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btn-logout-mobile').addEventListener('click', doLogout);
    });

    // ── Tags state ──
    let allTags = [];
    let allConvs = [];
    let activeFilterTagId = null;

    async function loadTags() {
      const res = await fetch('/api/tags');
      allTags = res.ok ? await res.json() : [];
      renderFilterBar();
    }

    function renderFilterBar() {
      const bar = document.getElementById('tag-filter-bar');
      if (!allTags.length) { bar.style.display = 'none'; return; }
      bar.style.display = 'block';
      bar.innerHTML = `
        <button class="tag-filter-chip ${activeFilterTagId === null ? 'tag-filter-chip--active' : ''}" data-tag-id="" style="margin-right:4px;">Todos</button>
        ${allTags.map(t => `
          <button class="tag-filter-chip ${activeFilterTagId === t.id ? 'tag-filter-chip--active' : ''}"
            data-tag-id="${t.id}"
            style="background:${activeFilterTagId === t.id ? t.color : 'transparent'};border-color:${t.color};color:${activeFilterTagId === t.id ? '#fff' : t.color};margin-right:4px;">
            ${escapeHtml(t.name)}
          </button>`).join('')}
      `;
      bar.querySelectorAll('.tag-filter-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const tid = btn.dataset.tagId ? Number(btn.dataset.tagId) : null;
          activeFilterTagId = tid;
          renderConvList();
          renderFilterBar();
        });
      });
    }

    function tagChips(tags) {
      if (!tags?.length) return '';
      return `<span class="conv-tags">${tags.map(t =>
        `<span class="conv-tag-chip" style="background:${t.color}20;color:${t.color};border:1px solid ${t.color}40;">${escapeHtml(t.name)}</span>`
      ).join('')}</span>`;
    }

    function renderConvList() {
      const list = document.getElementById('conv-list');
      const filtered = activeFilterTagId === null
        ? allConvs
        : allConvs.filter(c => c.tags?.some(t => t.id === activeFilterTagId));

      if (!filtered.length) {
        list.innerHTML = `
          <div class="no-convs">
            <p class="no-convs-title">${activeFilterTagId ? 'Sin conversaciones con esa etiqueta.' : 'Todavía no hay conversaciones.'}</p>
            ${!activeFilterTagId ? '<p class="no-convs-sub">Cuando tus clientes te escriban,<br>van a aparecer acá.</p>' : ''}
          </div>`;
        return;
      }

      list.innerHTML = filtered.map(c => `
        <button class="conv-item" data-id="${c.id}" onclick="openConv(${c.id}, this)">
          ${c.needs_attention ? '<span class="conv-attention-dot" title="Requiere atención"></span>' : ''}
          <span class="conv-number">${formatPhone(c.customer_id)}</span>
          <span class="conv-date">${formatDate(c.created_at)}</span>
          ${tagChips(c.tags)}
          ${labelBadge(c.label)}
        </button>
      `).join('');
    }

    // ── Load conversation list ──
    async function loadList() {
      const res = await fetch('/api/conversations');
      allConvs = await res.json().catch(() => []);
      renderConvList();
    }

    // ── Back to list (mobile) ──
    function backToList() {
      document.getElementById('thread').style.display = 'none';
      document.getElementById('empty-state').style.display = '';
      document.querySelectorAll('.conv-item').forEach(b => b.classList.remove('active'));
      document.getElementById('conv-panels').classList.remove('thread-open');
    }

    // ── Open a conversation ──
    async function openConv(id, el) {
      document.querySelectorAll('.conv-item').forEach(b => b.classList.remove('active'));
      el.classList.add('active');

      document.getElementById('conv-panels').classList.add('thread-open');
      document.getElementById('empty-state').style.display = 'none';
      document.getElementById('thread').style.display = 'flex';
      document.getElementById('thread-messages').innerHTML = '<div class="thread-loading">Cargando mensajes…</div>';

      const res = await fetch(`/api/conversations/${id}/messages`);
      if (!res.ok) {
        document.getElementById('thread-messages').innerHTML = '<p class="no-msgs">No se pudieron cargar los mensajes. Recargá la página e intentá de nuevo.</p>';
        return;
      }
      const { conversation, messages } = await res.json();

      const isPaused   = !!conversation.needs_attention;
      const needsHuman = !!conversation.needs_human;

      const convTags = conversation.tags || [];
      document.getElementById('thread-header').innerHTML = `
        <div class="thread-header-top">
          <span class="thread-phone">${formatPhone(conversation.customer_id)}</span>
          <span class="thread-meta">${messages.length} mensaje${messages.length !== 1 ? 's' : ''} · iniciado ${formatDate(conversation.created_at)}</span>
          <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
            <div style="position:relative;display:inline-block;">
              <div id="conv-tag-chips" style="display:inline-flex;gap:4px;align-items:center;flex-wrap:wrap;">
                ${convTags.map(t => `<span class="conv-tag-chip" style="background:${t.color}20;color:${t.color};border:1px solid ${t.color}40;">${escapeHtml(t.name)}</span>`).join('')}
                <button id="btn-tag-selector" class="btn-pause-toggle" onclick="toggleTagSelector(${id})" title="Editar etiquetas">＋ Etiquetas</button>
              </div>
              <div id="tag-selector-dropdown" style="display:none;position:absolute;top:calc(100% + 4px);left:0;z-index:200;background:#161616;border:1px solid #2a2a2a;border-radius:6px;padding:10px;min-width:220px;box-shadow:0 8px 24px rgba(0,0,0,0.6);">
                <p style="font-size:11px;color:#666;margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em;">Etiquetas</p>
                <div id="tag-selector-list"></div>
                <hr style="border:none;border-top:1px solid #2a2a2a;margin:10px 0;">
                <p style="font-size:11px;color:#666;margin:0 0 6px;">Nueva etiqueta</p>
                <input id="new-tag-name" type="text" placeholder="Nombre" maxlength="30"
                  style="width:100%;box-sizing:border-box;font-size:12px;padding:5px 7px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:3px;color:#f0ede8;margin-bottom:6px;">
                <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px;" id="color-palette"></div>
                <button onclick="createTagAndAdd(${id})" style="font-size:12px;padding:4px 10px;background:var(--accent,#C45C1A);color:#fff;border:none;border-radius:3px;cursor:pointer;width:100%;">Crear y asignar</button>
              </div>
            </div>
            <select class="conv-label-select" id="label-select" onchange="setLabel(${id}, this.value)">
              <option value="">Sin etiqueta</option>
              <option value="cliente"       ${conversation.label === 'cliente'       ? 'selected' : ''}>Cliente</option>
              <option value="prospecto"     ${conversation.label === 'prospecto'     ? 'selected' : ''}>Prospecto</option>
              <option value="no_interesado" ${conversation.label === 'no_interesado' ? 'selected' : ''}>No interesado</option>
            </select>
            ${!isPaused ? `<button class="btn-pause-toggle" onclick="pauseConv(${id})">Pausar bot</button>` : ''}
          </div>
        </div>
        ${needsHuman && !isPaused ? `
        <div class="needs-human-banner" id="needs-human-banner">
          <span>ℹ️ El asistente notificó al equipo — sigue respondiendo automáticamente</span>
          <button class="btn-pause-toggle" onclick="pauseConv(${id})">Tomar conversación</button>
        </div>` : ''}
        ${isPaused ? `
        <div class="pause-banner" id="pause-banner">
          <span class="pause-banner-text">⚠️ Asistente pausado — respondé al cliente desde acá</span>
          <button class="btn-resume" onclick="resumeConv(${id})">Reanudar bot</button>
        </div>
        <div class="panel-reply-box" id="panel-reply-box">
          <textarea class="panel-reply-textarea" id="panel-reply-text" rows="3" placeholder="Escribí tu respuesta al cliente…"></textarea>
          <button class="btn-panel-send" onclick="sendFromPanel(${id})">Enviar</button>
        </div>` : ''}
      `;

      if (!messages.length) {
        document.getElementById('thread-messages').innerHTML = '<p class="no-msgs">Sin mensajes aún.</p>';
        return;
      }

      document.getElementById('thread-messages').innerHTML = messages.map(m => `
        <div class="bubble-row ${m.role === 'user' ? 'row-user' : 'row-ai'}">
          <div class="bubble ${m.role === 'user' ? 'bubble-user' : 'bubble-ai'}">
            <p>${escapeHtml(m.content)}</p>
            <span class="bubble-time">${formatTime(m.created_at)}</span>
          </div>
        </div>
      `).join('');

      // Scroll to bottom
      const el2 = document.getElementById('thread-messages');
      el2.scrollTop = el2.scrollHeight;
    }

    // ── Resume conversation ──
    async function resumeConv(id) {
      const res = await fetch(`/api/conversations/${id}/resume`, { method: 'PATCH' });
      if (!res.ok) return;
      document.getElementById('pause-banner')?.remove();
      document.getElementById('panel-reply-box')?.remove();
      document.getElementById('needs-human-banner')?.remove();
      const dot = document.querySelector(`.conv-item[data-id="${id}"] .conv-attention-dot`);
      if (dot) dot.remove();
      // Re-add pause button
      const topRow = document.querySelector('.thread-header-top div');
      if (topRow && !topRow.querySelector('.btn-pause-toggle')) {
        const btn = document.createElement('button');
        btn.className = 'btn-pause-toggle';
        btn.textContent = 'Pausar bot';
        btn.onclick = () => pauseConv(id);
        topRow.appendChild(btn);
      }
    }

    // ── Pause conversation (manual) ──
    async function pauseConv(id) {
      const res = await fetch(`/api/conversations/${id}/pause`, { method: 'PATCH' });
      if (!res.ok) return;
      // Reload thread to show reply box
      const btn = document.querySelector(`.conv-item[data-id="${id}"]`);
      if (btn) openConv(id, btn);
    }

    // ── Send from panel ──
    async function sendFromPanel(id) {
      const ta  = document.getElementById('panel-reply-text');
      const text = ta?.value?.trim();
      if (!text) return;

      const sendBtn = document.querySelector('.btn-panel-send');
      if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = 'Enviando…'; }

      const res = await fetch(`/api/conversations/${id}/send`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text }),
      });

      if (sendBtn) { sendBtn.disabled = false; sendBtn.textContent = 'Enviar'; }

      if (!res.ok) {
        alert('No se pudo enviar el mensaje. Revisá la conexión de WhatsApp.');
        return;
      }

      // Append message to thread
      const msgList = document.getElementById('thread-messages');
      const row = document.createElement('div');
      row.className = 'bubble-row row-ai';
      row.innerHTML = `<div class="bubble bubble-ai"><p>${escapeHtml(text)}</p><span class="bubble-time">ahora</span></div>`;
      msgList.appendChild(row);
      msgList.scrollTop = msgList.scrollHeight;
      ta.value = '';
    }

    // ── Label helpers ──
    const LABEL_META = {
      cliente:        { text: 'Cliente',        cls: 'label-badge--cliente' },
      prospecto:      { text: 'Prospecto',      cls: 'label-badge--prospecto' },
      no_interesado:  { text: 'No interesado',  cls: 'label-badge--no_interesado' },
    };

    function labelBadge(label) {
      const meta = LABEL_META[label];
      if (!meta) return '';
      return `<span class="label-badge ${meta.cls}">${meta.text}</span>`;
    }

    async function setLabel(convId, label) {
      const res = await fetch(`/api/conversations/${convId}/label`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ label: label || null }),
      });
      if (!res.ok) return;
      const btn = document.querySelector(`.conv-item[data-id="${convId}"]`);
      if (!btn) return;
      const existing = btn.querySelector('.label-badge');
      if (existing) existing.remove();
      const newBadge = labelBadge(label);
      if (newBadge) btn.insertAdjacentHTML('beforeend', newBadge);
    }

    // ── Helpers ──
    function formatPhone(raw) {
      if (!raw) return 'Desconocido';
      return raw;
    }

    function formatDate(dt) {
      if (!dt) return '';
      const d = new Date(dt.replace(' ', 'T') + 'Z');
      return d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
    }

    function formatTime(dt) {
      if (!dt) return '';
      const d = new Date(dt.replace(' ', 'T') + 'Z');
      return d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                .replace(/\n/g,'<br>');
    }

    // ── Tag selector ──
    const TAG_COLORS = ['#3b82f6','#eab308','#22c55e','#6b7280','#f97316','#ef4444','#a855f7','#06b6d4'];
    let selectedNewTagColor = TAG_COLORS[0];
    let currentTagSelectorConvId = null;

    function toggleTagSelector(convId) {
      const dropdown = document.getElementById('tag-selector-dropdown');
      const isOpen = dropdown.style.display !== 'none';
      if (isOpen && currentTagSelectorConvId === convId) {
        dropdown.style.display = 'none';
        return;
      }
      currentTagSelectorConvId = convId;
      dropdown.style.display = 'block';
      renderTagSelectorList(convId);
      renderColorPalette();
      document.getElementById('new-tag-name').value = '';
    }

    function renderTagSelectorList(convId) {
      const currentChips = document.querySelectorAll('#conv-tag-chips .conv-tag-chip');
      const currentTagNames = Array.from(currentChips).map(c => c.textContent.trim());
      const currentTagIds = allTags
        .filter(t => currentTagNames.includes(t.name))
        .map(t => t.id);

      const list = document.getElementById('tag-selector-list');
      list.innerHTML = allTags.map(t => `
        <label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px;color:#ccc;">
          <input type="checkbox" data-tag-id="${t.id}" ${currentTagIds.includes(t.id) ? 'checked' : ''}
            onchange="applyTagChange(${convId})"
            style="accent-color:${t.color};">
          <span class="conv-tag-chip" style="background:${t.color}20;color:${t.color};border:1px solid ${t.color}40;">${escapeHtml(t.name)}</span>
          ${!t.is_default ? `<button onclick="removeTag(${t.id},${convId})" style="margin-left:auto;font-size:10px;padding:1px 5px;border:1px solid #333;border-radius:2px;background:transparent;color:#666;cursor:pointer;" title="Eliminar etiqueta">✕</button>` : ''}
        </label>
      `).join('');
    }

    function renderColorPalette() {
      const pal = document.getElementById('color-palette');
      pal.innerHTML = TAG_COLORS.map(c => `
        <button onclick="selectColor('${c}')" style="width:20px;height:20px;border-radius:50%;background:${c};border:2px solid ${c === selectedNewTagColor ? '#fff' : 'transparent'};cursor:pointer;" data-color="${c}"></button>
      `).join('');
    }

    function selectColor(color) {
      selectedNewTagColor = color;
      renderColorPalette();
    }

    async function applyTagChange(convId) {
      const checkboxes = document.querySelectorAll('#tag-selector-list input[type=checkbox]');
      const tagIds = Array.from(checkboxes).filter(c => c.checked).map(c => Number(c.dataset.tagId));
      const res = await fetch(`/api/conversations/${convId}/tags`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tagIds }),
      });
      if (!res.ok) return;
      const { tags } = await res.json();
      // Update chips in header
      const chipsEl = document.getElementById('conv-tag-chips');
      const btn = document.getElementById('btn-tag-selector');
      if (chipsEl) {
        chipsEl.innerHTML = tags.map(t =>
          `<span class="conv-tag-chip" style="background:${t.color}20;color:${t.color};border:1px solid ${t.color}40;">${escapeHtml(t.name)}</span>`
        ).join('') + (btn ? btn.outerHTML : '');
      }
      // Update allConvs cache and re-render list
      const conv = allConvs.find(c => c.id === convId);
      if (conv) { conv.tags = tags; renderConvList(); }
    }

    async function createTagAndAdd(convId) {
      const name = document.getElementById('new-tag-name').value.trim();
      if (!name) return;
      const res = await fetch('/api/tags', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, color: selectedNewTagColor }),
      });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        alert(d.error || 'No se pudo crear la etiqueta.');
        return;
      }
      const newTag = await res.json();
      allTags.push(newTag);
      // Check the new tag and apply
      const checkboxes = document.querySelectorAll('#tag-selector-list input[type=checkbox]');
      const tagIds = Array.from(checkboxes).filter(c => c.checked).map(c => Number(c.dataset.tagId));
      tagIds.push(newTag.id);
      await fetch(`/api/conversations/${convId}/tags`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ tagIds }),
      });
      renderTagSelectorList(convId);
      renderColorPalette();
      renderFilterBar();
      document.getElementById('new-tag-name').value = '';
      await applyTagChange(convId);
    }

    async function removeTag(tagId, convId) {
      if (!confirm('¿Eliminás esta etiqueta? Se va a quitar de todas las conversaciones.')) return;
      const res = await fetch(`/api/tags/${tagId}`, { method: 'DELETE' });
      if (!res.ok) {
        const d = await res.json().catch(() => ({}));
        alert(d.error || 'No se pudo eliminar.');
        return;
      }
      allTags = allTags.filter(t => t.id !== tagId);
      // Remove from allConvs cache
      allConvs.forEach(c => { if (c.tags) c.tags = c.tags.filter(t => t.id !== tagId); });
      if (activeFilterTagId === tagId) { activeFilterTagId = null; }
      renderTagSelectorList(convId);
      renderFilterBar();
      renderConvList();
    }

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('tag-selector-dropdown');
      if (!dropdown || dropdown.style.display === 'none') return;
      if (!e.target.closest('#tag-selector-dropdown') && !e.target.closest('#btn-tag-selector')) {
        dropdown.style.display = 'none';
      }
    });

    loadTags();
    loadList();
  </script>

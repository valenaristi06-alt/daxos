<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logodaxosnaranjanofondo.png">
  <link rel="apple-touch-icon" href="/logodaxosnaranjanofondo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrarse — Daxos</title>
  <link rel="stylesheet" href="/auth.css" />
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/logodaxosnaranjanofondo.png" alt="" class="logo-img">Daxos</div>
    <h1>Crear cuenta</h1>
    <p class="subtitle">Ingresá tu email y una contraseña para empezar.</p>

    <form id="form">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" placeholder="tu@email.com" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <div class="pw-wrap">
          <input id="password" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required />
          <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" onclick="togglePw('password',this)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <button type="submit" id="btn">Crear cuenta</button>
      <div class="error" id="error"></div>
    </form>

    <p class="footer-link">¿Ya tenés cuenta? <a href="/login.html">Iniciá sesión</a></p>
  </div>

  <script>
    const _EYE    = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const _EYEOFF = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
    function togglePw(id, btn) {
      const inp = document.getElementById(id);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = show ? _EYEOFF : _EYE;
      btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const errorEl = document.getElementById('error');
      errorEl.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Creando cuenta...';

      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });

      const data = await res.json();
      if (res.ok) {
        window.location.href = '/inicio.html';
      } else {
        errorEl.textContent = data.error;
        errorEl.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>

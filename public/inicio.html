<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logodaxosnaranjanofondo.png">
  <link rel="apple-touch-icon" href="/logodaxosnaranjanofondo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Inicio — Daxos</title>
  <link rel="stylesheet" href="/dashboard.css" />
  <script src="/toast.js"></script>
</head>
<body>

  <div class="app-layout">

  <aside class="app-sidebar">
    <a href="/inicio.html" class="sidebar-logo">
      <img src="/logodaxosnaranjanofondo.png" alt="" class="logo-img">DAXOS
    </a>
    <div class="sidebar-divider"></div>
    <nav class="sidebar-nav" aria-label="Principal">
      <a href="/inicio.html" class="sidebar-link active" aria-current="page">
        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 8L8 2L14 8V14H10V10H6V14H2V8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Inicio
      </a>
      <a href="/dashboard.html" class="sidebar-link">
        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="5" cy="4" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="10" cy="8" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="6" cy="12" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        Configuración
      </a>
      <a href="/conversations.html" class="sidebar-link">
        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 3C2 2 3 1 4 1H12C13 1 14 2 14 3V9C14 10 13 11 12 11H7L4 14V11C3 11 2 10 2 9V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Conversaciones
      </a>
    </nav>
    <div class="sidebar-bottom">
      <span class="plan-badge" id="plan-badge" style="display:none"></span>
      <span class="sidebar-email" id="user-email"></span>
      <button class="btn-logout" id="btn-logout">Salir</button>
    </div>
  </aside>

  <main class="app-main" id="main-content">

    <!-- 1. TITULAR -->
    <h1 class="inicio-headline" id="inicio-headline" aria-live="polite">
      <span class="skeleton skeleton-line" style="width:70%;height:1.1em;display:block;border-radius:4px;" aria-hidden="true"></span>
    </h1>

    <!-- 2. FILA DE ESTADO -->
    <div id="status-row" class="inicio-status-row" aria-live="polite"></div>

    <!-- 3. AVISO DE TRIAL / PLAN -->
    <div id="trial-banner" style="display:none"></div>

    <!-- 4. TARJETA ÚLTIMA CONVERSACIÓN -->
    <div id="last-conv-card" class="lc-card" aria-label="Última conversación">
      <div style="display:flex;flex-direction:column;gap:10px;" aria-hidden="true">
        <div class="skeleton skeleton-line" style="width:40%;height:14px;border-radius:3px;"></div>
        <div class="skeleton" style="height:46px;border-radius:8px;width:78%;"></div>
        <div class="skeleton" style="height:46px;border-radius:8px;width:82%;align-self:flex-end;"></div>
        <div class="skeleton skeleton-line" style="width:30%;height:12px;border-radius:3px;"></div>
      </div>
    </div>

    <!-- 5. FRASE RESUMEN -->
    <p id="inicio-summary" class="inicio-summary" aria-live="polite"></p>

    <!-- 6. GRÁFICO 7 DÍAS -->
    <div class="chart-section">
      <div class="chart-header">
        <span class="chart-title">Últimos 7 días</span>
        <span class="chart-subtitle" id="chart-total"></span>
      </div>
      <div class="chart-wrap">
        <div class="chart-bars chart-bars--compact" id="chart-bars" role="img" aria-label="Gráfico de mensajes por día">
          <div style="width:100%;display:flex;align-items:flex-end;gap:8px;height:100%;" aria-hidden="true">
            <div class="skeleton" style="flex:1;height:45%"></div>
            <div class="skeleton" style="flex:1;height:70%"></div>
            <div class="skeleton" style="flex:1;height:30%"></div>
            <div class="skeleton" style="flex:1;height:80%"></div>
            <div class="skeleton" style="flex:1;height:55%"></div>
            <div class="skeleton" style="flex:1;height:40%"></div>
            <div class="skeleton" style="flex:1;height:65%"></div>
          </div>
        </div>
      </div>
    </div>

  </main>
  </div><!-- /app-layout -->

  <nav class="mobile-nav" aria-label="Navegación principal">
    <a href="/inicio.html" class="mobile-nav-item active" aria-current="page">
      <svg class="mobile-nav-icon" width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 8L8 2L14 8V14H10V10H6V14H2V8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      Inicio
    </a>
    <a href="/dashboard.html" class="mobile-nav-item">
      <svg class="mobile-nav-icon" width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="5" cy="4" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="10" cy="8" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="6" cy="12" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      Configuración
    </a>
    <a href="/conversations.html" class="mobile-nav-item">
      <svg class="mobile-nav-icon" width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M2 3C2 2 3 1 4 1H12C13 1 14 2 14 3V9C14 10 13 11 12 11H7L4 14V11C3 11 2 10 2 9V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
      </svg>
      Conversaciones
    </a>
  </nav>

  <button class="mobile-corner-logout" id="btn-logout-mobile" type="button">Salir</button>

  <script>
  'use strict';
  (async () => {
    // ── helpers ──────────────────────────────────────────────────────────────
    function formatPhone(raw) {
      if (!raw) return 'Desconocido';
      const d = raw.replace(/\D/g, '');
      if (d.startsWith('598') && d.length === 11)
        return `+598 ${d.slice(3,5)} ${d.slice(5,8)} ${d.slice(8)}`;
      if (d.length === 9 && d.startsWith('0'))
        return `+598 ${d.slice(1,3)} ${d.slice(3,6)} ${d.slice(6)}`;
      return raw;
    }

    // Safari/iOS: SQLite returns "YYYY-MM-DD HH:MM:SS" (space, no Z) → Invalid Date
    function parseISO(str) {
      if (!str) return null;
      const s = ('' + str).replace(' ', 'T');
      const t = s.endsWith('Z') ? s : s + 'Z';
      const d = new Date(t);
      return isNaN(d.getTime()) ? null : d;
    }

    function timeAgo(iso) {
      if (!iso) return '';
      const d = parseISO(iso);
      if (!d) return '';
      const diff = Math.floor((Date.now() - d.getTime()) / 1000);
      if (diff < 90)    return 'hace un momento';
      if (diff < 3600)  return 'hace ' + Math.floor(diff / 60) + ' min';
      if (diff < 86400) return 'hace ' + Math.floor(diff / 3600) + ' h';
      const days = Math.floor(diff / 86400);
      return 'hace ' + days + ' día' + (days !== 1 ? 's' : '');
    }

    function fmtContent(content) {
      if (!content) return '';
      if (content === '[imagen]')              return '📷 Foto';
      if (content.startsWith('[imagen] '))     return '📷 ' + content.slice(9);
      if (content === '[audio]')               return '🎤 Audio';
      if (content.startsWith('[media:sticker')) return '🎞️ Sticker';
      if (content.startsWith('[media:'))       return '📎 Adjunto';
      return content;
    }

    function isBotActive(biz) {
      if (!biz) return false;
      if (biz.plan !== 'arranque') {
        if (biz.subscription_status === 'cancelled' || biz.subscription_status === 'paused') {
          const expiry = biz.plan_expires_at || biz.trial_ends_at;
          const d = parseISO(expiry);
          if (!d || d < new Date()) return false;
        }
        return true;
      }
      if (biz.plan_paid_at) return true;
      if (!biz.trial_starts_at) return false;
      if (biz.trial_grace_started_at) return false;
      const endDate = parseISO(biz.trial_ends_at);
      const trialOver =
        (endDate && endDate < new Date()) ||
        (biz.trial_conv_count ?? 0) >= (biz.trial_conv_limit ?? 150);
      return !trialOver;
    }

    // ── auth ─────────────────────────────────────────────────────────────────
    const meRes = await fetch('/auth/me');
    if (!meRes.ok) { window.location.href = '/login.html'; return; }
    const { email } = await meRes.json();
    document.getElementById('user-email').textContent = email;

    async function doLogout() {
      await fetch('/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    }
    document.getElementById('btn-logout').addEventListener('click', doLogout);
    document.getElementById('btn-logout-mobile').addEventListener('click', doLogout);

    // ── fetch all data in parallel ────────────────────────────────────────────
    const [bizRes, todayRes, dailyRes, convsRes] = await Promise.all([
      fetch('/api/business'),
      fetch('/api/stats/today'),
      fetch('/api/stats/messages-daily'),
      fetch('/api/conversations'),
    ]);

    const b       = bizRes.ok    ? await bizRes.json()    : null;
    const today   = todayRes.ok  ? await todayRes.json()  : { messages24h: 0, uniqueClientsToday: 0, pausedToday: 0, resolvedToday: 0 };
    const daily   = dailyRes.ok  ? await dailyRes.json()  : [];
    const allConvs = convsRes.ok ? await convsRes.json()  : [];

    // non-excluded only (bot-handled)
    const botConvs = allConvs.filter(c => !c.is_excluded);

    // ── plan badge ────────────────────────────────────────────────────────────
    if (b?.plan) {
      const LABELS = { arranque: 'Arranque', crecimiento: 'Crecimiento', a_medida: 'A medida' };
      const badge = document.getElementById('plan-badge');
      badge.textContent = LABELS[b.plan] || b.plan;
      badge.style.display = 'inline-block';
    }

    // ── 1. TITULAR ────────────────────────────────────────────────────────────
    (function renderHeadline() {
      const el = document.getElementById('inicio-headline');
      // Mirror server: date(col, '-3 hours') = date('now', '-3 hours'). Returns null on invalid date (safe fallback).
      function dateUTC3(iso) {
        const d = parseISO(iso);
        if (!d) return null;
        return new Date(d.getTime() - 3 * 60 * 60 * 1000).toISOString().slice(0, 10);
      }
      const todayStr = new Date(Date.now() - 3 * 60 * 60 * 1000).toISOString().slice(0, 10);
      // DISTINCT customer_id — schema has no unique constraint on (business_id, customer_id)
      const n = new Set(
        allConvs
          .filter(c => !c.is_excluded && c.last_msg_at && dateUTC3(c.last_msg_at) === todayStr)
          .map(c => c.customer_id)
      ).size;
      let text;
      if (n > 0) {
        text = 'Hoy tu asistente atendió a ' + n + ' cliente' + (n !== 1 ? 's' : '');
      } else if (botConvs.length > 0) {
        text = 'Hoy todavía no escribió nadie.';
      } else {
        text = 'Tu asistente está listo.';
      }
      el.textContent = text;
    })();

    // ── 2. FILA DE ESTADO ────────────────────────────────────────────────────
    (function renderStatus() {
      const row = document.getElementById('status-row');
      const waOk = !!b?.phone_number_id;
      row.innerHTML = '';
      if (waOk) {
        const wrap = document.createElement('div');
        wrap.className = 'inicio-status-ok';
        const dot  = document.createElement('span');
        dot.className = 'inicio-status-dot';
        dot.setAttribute('aria-hidden', 'true');
        const online = document.createElement('span');
        online.textContent = 'En línea';
        const sep = document.createElement('span');
        sep.className = 'inicio-status-sep';
        sep.setAttribute('aria-hidden', 'true');
        sep.textContent = '·';
        const wa = document.createElement('span');
        wa.textContent = 'WhatsApp conectado';
        wrap.append(dot, online, sep, wa);
        row.appendChild(wrap);
      } else {
        const box = document.createElement('div');
        box.className = 'inicio-status-error';
        box.setAttribute('role', 'alert');
        const txt = document.createElement('span');
        txt.className = 'inicio-status-error-text';
        txt.textContent = 'WhatsApp desconectado. Tu asistente no está respondiendo.';
        const btn = document.createElement('a');
        btn.href = '/dashboard.html';
        btn.className = 'inicio-status-reconectar';
        btn.textContent = 'Reconectar';
        box.append(txt, btn);
        row.appendChild(box);
      }
    })();

    // ── 3. AVISO DE TRIAL / PLAN ─────────────────────────────────────────────
    (function renderTrialBanner() {
      const banner = document.getElementById('trial-banner');
      if (!b) {
        banner.className = 'trial-banner trial-banner--active';
        banner.innerHTML = '<span class="trial-msg">Completá tu configuración para empezar.</span>';
        banner.style.display = 'flex';
      } else if (b.plan !== 'arranque' && (b.subscription_status === 'cancelled' || b.subscription_status === 'paused')) {
        const expiry = b.plan_expires_at || b.trial_ends_at;
        const expiryD = parseISO(expiry);
        if (!expiry || !expiryD || expiryD < new Date()) {
          banner.className = 'trial-banner trial-banner--expired';
          banner.innerHTML = `<span class="trial-msg">Tu suscripción está inactiva.</span>
            <a href="https://wa.me/59892052508?text=Quiero%20activar%20mi%20plan" class="trial-action" target="_blank" rel="noopener">Quiero activar mi plan</a>`;
          banner.style.display = 'flex';
        }
      } else if (b.plan === 'arranque' && !b.plan_paid_at && !b.plan_cortesia) {
        if (!b.trial_starts_at) {
          banner.className = 'trial-banner trial-banner--active';
          banner.innerHTML = '<span class="trial-msg">Conectá tu WhatsApp para empezar tu prueba de 14 días.</span>';
          banner.style.display = 'flex';
        } else if (b.trial_grace_started_at) {
          const graceStart = parseISO(b.trial_grace_started_at);
          const graceHoursLeft = graceStart ? Math.max(0, 72 - (Date.now() - graceStart.getTime()) / 3600000) : 0;
          banner.className = 'trial-banner trial-banner--expired';
          banner.innerHTML = `<span class="trial-msg">Prueba vencida — modo de gracia: ${Math.ceil(graceHoursLeft)} h restantes.</span>
            <a href="https://wa.me/59892052508?text=Quiero%20activar%20mi%20plan" class="trial-action" target="_blank" rel="noopener">Activar mi plan</a>`;
          banner.style.display = 'flex';
        } else {
          const startsAt    = parseISO(b.trial_starts_at);
          const daysElapsed = startsAt ? Math.floor((Date.now() - startsAt.getTime()) / 86400000) : 0;
          const dayNum      = Math.min(daysElapsed + 1, 14);
          const convCount   = b.trial_conv_count ?? 0;
          const convLimit   = b.trial_conv_limit ?? 150;
          const trialEndDate = parseISO(b.trial_ends_at);
          const trialOver   =
            (trialEndDate && trialEndDate < new Date()) ||
            convCount >= convLimit;
          if (trialOver) {
            banner.className = 'trial-banner trial-banner--expired';
            banner.innerHTML = `<span class="trial-msg">Tu prueba gratuita terminó.</span>
              <a href="https://wa.me/59892052508?text=Quiero%20activar%20mi%20plan" class="trial-action" target="_blank" rel="noopener">Activar mi plan</a>`;
          } else {
            banner.className = 'trial-banner trial-banner--active';
            banner.innerHTML = `<span class="trial-msg">Prueba: día ${dayNum} de 14 · ${convCount} de ${convLimit} conversaciones.</span>`;
          }
          banner.style.display = 'flex';
        }
      }
    })();

    // ── 4. TARJETA ÚLTIMA CONVERSACIÓN ───────────────────────────────────────
    async function renderLastConv() {
      const card = document.getElementById('last-conv-card');
      const latestConv = botConvs[0] || null;

      if (!latestConv) {
        // Empty state
        card.className = 'lc-empty';
        card.innerHTML = '';
        const txt = document.createElement('p');
        txt.className = 'lc-empty-text';
        txt.textContent = 'Todavía no hay conversaciones. Escribile al WhatsApp de tu negocio para probar cómo responde tu asistente.';
        card.appendChild(txt);

        if (b?.whatsapp_number) {
          const phoneBtn = document.createElement('button');
          phoneBtn.type = 'button';
          phoneBtn.className = 'lc-empty-phone';
          phoneBtn.setAttribute('aria-label', 'Copiar número de WhatsApp');
          const numSpan = document.createElement('span');
          numSpan.textContent = formatPhone(b.whatsapp_number);
          const iconSpan = document.createElement('span');
          iconSpan.setAttribute('aria-hidden', 'true');
          iconSpan.textContent = '📋';
          phoneBtn.append(numSpan, iconSpan);
          phoneBtn.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(b.whatsapp_number);
              iconSpan.textContent = '✓';
              setTimeout(() => { iconSpan.textContent = '📋'; }, 2000);
            } catch (_) {}
          });
          card.appendChild(phoneBtn);
        }
        return;
      }

      // Fetch last 3 messages
      let lastMessages = [];
      try {
        const msgRes = await fetch(`/api/conversations/${latestConv.id}/messages`);
        if (msgRes.ok) {
          const data = await msgRes.json();
          lastMessages = (data.messages || []).filter(m => !m.silent).slice(-3);
        }
      } catch (_) {}

      // Build card
      card.className = 'lc-card';
      card.innerHTML = '';

      // Header: who + time
      const header = document.createElement('div');
      header.className = 'lc-card-header';
      const who = document.createElement('span');
      who.className = 'lc-card-who';
      who.textContent = formatPhone(latestConv.customer_id);
      const time = document.createElement('span');
      time.className = 'lc-card-time';
      time.textContent = timeAgo(latestConv.last_msg_at || latestConv.created_at);
      header.append(who, time);
      card.appendChild(header);

      // Bubbles
      if (lastMessages.length > 0) {
        const bubblesWrap = document.createElement('div');
        bubblesWrap.className = 'lc-bubbles';
        for (const msg of lastMessages) {
          const bub = document.createElement('div');
          bub.className = `lc-bubble lc-bubble--${msg.role === 'assistant' ? 'bot' : 'user'}`;
          bub.textContent = fmtContent(msg.content);
          bubblesWrap.appendChild(bub);
        }
        card.appendChild(bubblesWrap);
      } else if (latestConv.last_message) {
        // Fallback: show last_message from list if messages fetch empty
        const bubblesWrap = document.createElement('div');
        bubblesWrap.className = 'lc-bubbles';
        const bub = document.createElement('div');
        bub.className = 'lc-bubble lc-bubble--user';
        bub.textContent = fmtContent(latestConv.last_message);
        bubblesWrap.appendChild(bub);
        card.appendChild(bubblesWrap);
      }

      // "Ver conversación" link
      const action = document.createElement('a');
      action.href = `/conversations.html?conv=${latestConv.id}`;
      action.className = 'lc-action';
      action.textContent = 'Ver conversación';
      card.appendChild(action);
    }
    await renderLastConv();

    // ── 5. FRASE RESUMEN ─────────────────────────────────────────────────────
    (function renderSummary() {
      const el = document.getElementById('inicio-summary');
      const needsAttn = allConvs.filter(c => !c.is_excluded && c.needs_attention);
      const n = today.messages24h;
      const msgText = `${n} mensaje${n !== 1 ? 's' : ''} en las últimas 24 h.`;

      if (needsAttn.length > 0) {
        const c = needsAttn.length;
        el.textContent = msgText + ' ';
        const link = document.createElement('a');
        link.href = '/conversations.html';
        link.textContent = `${c} conversación${c !== 1 ? 'es' : ''} espera${c !== 1 ? 'n' : ''} que la${c !== 1 ? 's' : ''} atiendas vos`;
        el.appendChild(link);
        el.appendChild(document.createTextNode('.'));
      } else {
        el.textContent = msgText + ' Nadie está esperando que lo atiendas vos.';
      }
    })();

    // ── 6. GRÁFICO 7 DÍAS ────────────────────────────────────────────────────
    (function renderChart(data) {
      const container = document.getElementById('chart-bars');
      if (!data || !data.length) { container.innerHTML = ''; return; }

      const max     = Math.max(...data.map(d => d.count), 1);
      const total   = data.reduce((s, d) => s + d.count, 0);
      const todayStr = new Date(Date.now() - 3 * 60 * 60 * 1000).toISOString().slice(0, 10);

      document.getElementById('chart-total').textContent =
        total === 0 ? 'sin actividad esta semana' : `${total} mensajes esta semana`;

      const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
      container.innerHTML = data.map(({ day, count }) => {
        const pct     = Math.round((count / max) * 100);
        const label   = DAYS[new Date(day + 'T12:00:00').getDay()];
        const isToday = day === todayStr;
        const title   = `${day}: ${count} mensaje${count !== 1 ? 's' : ''}`;
        return `<div class="chart-col" title="${title}">
          <div class="chart-bar-wrap">
            <div class="chart-bar ${count === 0 ? 'chart-bar--zero' : ''} ${isToday ? 'chart-bar--today' : ''}"
                 style="height:${count === 0 ? 3 : Math.max(pct, 6)}%"></div>
          </div>
          <span class="chart-day" style="${isToday ? 'color:var(--accent);font-weight:700' : ''}">${label}</span>
          <span class="chart-count">${count > 0 ? count : ''}</span>
        </div>`;
      }).join('');
    })(daily);

  })();
  </script>

</body>
</html>

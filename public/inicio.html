<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="/toast.js"></script>
</head>
<body>

    <nav class="sidebar-nav">

        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">

        </svg>
        Inicio
      </a>
      <a href="/dashboard.html" class="sidebar-link">
        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <line x1="2" y1="4" x2="14" y2="4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
          <circle cx="5" cy="4" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="10" cy="8" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
          <circle cx="6" cy="12" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>
        </svg>
        Configuración
      </a>
      <a href="/conversations.html" class="sidebar-link">
        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 3C2 2 3 1 4 1H12C13 1 14 2 14 3V9C14 10 13 11 12 11H7L4 14V11C3 11 2 10 2 9V3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Conversaciones
      </a>
    </nav>
    <div class="sidebar-bottom">
      <span class="plan-badge" id="plan-badge" style="display:none"></span>
      <span class="sidebar-email" id="user-email"></span>
      <button class="btn-logout" id="btn-logout">Salir</button>
    </div>
  </aside>

  <main class="app-main">

    <p class="page-terminal">&gt; inicio</p>
    <h1 class="page-title" id="greeting">Hola</h1>

    <div id="trial-banner" style="display:none"></div>

    <div class="inicio-grid" id="inicio-grid">

      <!-- Integraciones -->
      <div class="icard" id="card-whatsapp">
        <p class="icard-label">Integraciones</p>
        <div class="icard-skeleton">
          <div class="skeleton skeleton-line skeleton-line--mid"></div>
        </div>
      </div>

      <!-- Trial / plan -->
      <div class="icard" id="card-trial" style="display:none">
        <p class="icard-label">Período de prueba</p>
        <div class="icard-big-num" id="trial-days-num"></div>
        <p class="icard-big-label" id="trial-days-label"></p>
      </div>

      <!-- Conversations -->
      <div class="icard" id="card-convs">
        <p class="icard-label">Conversaciones</p>
        <div id="convs-content">
          <div class="icard-skeleton">
            <div class="skeleton skeleton-line skeleton-line--short"></div>
            <div class="skeleton skeleton-line skeleton-line--mid"></div>
          </div>
        </div>
      </div>

    </div>

    <!-- 7-day chart -->
    <div class="chart-section">
      <div class="chart-header">
        <span class="chart-title">Conversaciones · últimos 7 días</span>
        <span class="chart-subtitle" id="chart-total"></span>
      </div>
      <div class="chart-wrap">
        <div class="chart-bars" id="chart-bars">
          <!-- skeleton while loading -->
          <div class="icard-skeleton" style="width:100%;flex-direction:row;align-items:flex-end;gap:8px;height:80px;">
            <div class="skeleton" style="flex:1;height:45%"></div>
            <div class="skeleton" style="flex:1;height:70%"></div>
            <div class="skeleton" style="flex:1;height:30%"></div>
            <div class="skeleton" style="flex:1;height:80%"></div>
            <div class="skeleton" style="flex:1;height:55%"></div>
            <div class="skeleton" style="flex:1;height:40%"></div>
            <div class="skeleton" style="flex:1;height:65%"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="shortcut-grid">
      <a href="/dashboard.html" class="shortcut-btn">
        <span class="shortcut-btn-tag">01</span>
        <span class="shortcut-btn-title">Configurar mi negocio</span>
        <span class="shortcut-btn-sub">Nombre, ejemplos de venta, WhatsApp y voz.</span>
      </a>
      <a href="/conversations.html" class="shortcut-btn">
        <span class="shortcut-btn-tag">02</span>
        <span class="shortcut-btn-title">Ver conversaciones</span>
        <span class="shortcut-btn-sub">Revisá los chats que tuvo tu asistente.</span>
      </a>
    </div>

  <script>
    (async () => {
      // Auth check
      const meRes = await fetch('/auth/me');
      if (!meRes.ok) { window.location.href = '/login.html'; return; }
      const { email } = await meRes.json();
      document.getElementById('user-email').textContent = email;

      async function doLogout() {
        await fetch('/auth/logout', { method: 'POST' });
        window.location.href = '/login.html';
      }
      document.getElementById('btn-logout').addEventListener('click', doLogout);
      document.getElementById('btn-logout-mobile').addEventListener('click', doLogout);

      // Load business + stats in parallel
      const [bRes, sRes, dRes] = await Promise.all([
        fetch('/api/business'),
        fetch('/api/stats'),
        fetch('/api/stats/daily'),
      ]);
      const b = bRes.ok ? await bRes.json() : null;
      const stats = sRes.ok ? await sRes.json() : { conversation_count: 0 };
      const daily = dRes.ok ? await dRes.json() : [];

      // Plan badge
      if (b?.plan) {
        const badge = document.getElementById('plan-badge');
        badge.textContent = b.plan;
        badge.style.display = 'inline-block';
      }

      // Greeting
      document.getElementById('greeting').textContent = b?.name ? `Hola, ${b.name}` : 'Hola';

      // Trial banner (top, small — same as dashboard)
      const banner = document.getElementById('trial-banner');
      if (!b) {
        banner.className = 'trial-banner trial-banner--active';
        banner.innerHTML = '<span class="trial-msg">Tenés 14 días de prueba gratis. Completá tu configuración para empezar.</span>';
        banner.style.display = 'flex';
      } else if (b.plan === 'arranque' && b.trial_ends_at) {
        const endsAt = new Date(b.trial_ends_at);
        const now = new Date();
        if (endsAt < now) {
          banner.className = 'trial-banner trial-banner--expired';
          banner.innerHTML = `<span class="trial-msg">Tu prueba gratuita terminó.</span>
            <a href="https://mpago.la/1PDxazc" class="trial-action" target="_blank" rel="noopener">Activá tu plan →</a>`;
          banner.style.display = 'flex';
        } else {
          const daysLeft = Math.ceil((endsAt - now) / (1000 * 60 * 60 * 24));
          banner.className = 'trial-banner trial-banner--active';
          banner.innerHTML = `<span class="trial-msg">Te ${daysLeft === 1 ? 'queda 1 día' : `quedan ${daysLeft} días`} de prueba gratis.</span>`;
          banner.style.display = 'flex';
        }
      }

      // Integraciones card (replace skeleton)
      const waCard = document.getElementById('card-whatsapp');
      const waRow = document.createElement('p');
      if (b?.whatsapp_number) {
        waRow.className = 'icard-status-ok';
        waRow.textContent = 'WhatsApp: Conectado ✓';
      } else {
        waRow.className = 'icard-status-warn';
        waRow.innerHTML = 'WhatsApp: <a href="/dashboard.html">No conectado</a>';
      }
      const igRow = document.createElement('p');
      igRow.className = 'icard-status-soon';
      igRow.textContent = 'Instagram: Próximamente';
      const wrap = document.createElement('div');
      wrap.append(waRow, igRow);
      waCard.querySelector('.icard-skeleton').replaceWith(wrap);

      // Trial card (prominent days remaining — only for arranque with active trial)
      const trialCard = document.getElementById('card-trial');
      if (b?.plan === 'arranque' && b?.trial_ends_at) {
        const endsAt = new Date(b.trial_ends_at);
        const now = new Date();
        trialCard.style.display = 'block';
        if (endsAt < now) {
          document.getElementById('trial-days-num').className = 'icard-big-num';
          document.getElementById('trial-days-num').textContent = '0';
          document.getElementById('trial-days-label').textContent = 'días restantes. Tu prueba terminó.';
        } else {
          const daysLeft = Math.ceil((endsAt - now) / (1000 * 60 * 60 * 24));
          document.getElementById('trial-days-num').textContent = daysLeft;
          document.getElementById('trial-days-label').textContent = `día${daysLeft !== 1 ? 's' : ''} restante${daysLeft !== 1 ? 's' : ''} de prueba gratis.`;
        }
      }

      function renderDailyChart(data) {
        const container = document.getElementById('chart-bars');
        if (!data || !data.length) { container.innerHTML = ''; return; }

        const max = Math.max(...data.map(d => d.count), 1);
        const totalWeek = data.reduce((s, d) => s + d.count, 0);

        const totalEl = document.getElementById('chart-total');
        totalEl.textContent = totalWeek === 0 ? 'sin actividad esta semana'
          : `${totalWeek} esta semana`;

        const DAYS = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
        container.innerHTML = data.map(({ day, count }) => {
          const pct = Math.round((count / max) * 100);
          const label = DAYS[new Date(day + 'T12:00:00').getDay()];
          return `
            <div class="chart-col" title="${day}: ${count} conversación${count !== 1 ? 'es' : ''}">
              <div class="chart-bar-wrap">
                <div class="chart-bar ${count === 0 ? 'chart-bar--zero' : ''}"
                     style="height:${count === 0 ? 3 : Math.max(pct, 6)}%"></div>
              </div>
              <span class="chart-day">${label}</span>
              <span class="chart-count">${count > 0 ? count : ''}</span>
            </div>`;
        }).join('');
      }

      function formatPhone(raw) {
        if (!raw) return 'Desconocido';
        if (raw.length > 8) return raw.slice(0, -6).replace(/./g, '·') + raw.slice(-6);
        return raw;
      }

      function timeAgo(dt) {
        const d = new Date(dt.replace(' ', 'T') + 'Z');
        const diff = Date.now() - d.getTime();
        const mins = Math.floor(diff / 60000);
        const hrs  = Math.floor(diff / 3600000);
        const days = Math.floor(diff / 86400000);
        if (mins < 1)  return 'ahora';
        if (mins < 60) return `hace ${mins} min`;
        if (hrs < 24)  return `hace ${hrs}h`;
        return `hace ${days}d`;
      }

      function escapeHtml(s) {
        return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }

      // 7-day chart
      renderDailyChart(daily);

      // Conversations card
      const convsEl = document.getElementById('convs-content');
      const count = stats.conversation_count;
      if (count === 0) {
        convsEl.innerHTML = '<p class="icard-empty-msg">Todavía no tuviste conversaciones — en cuanto tus clientes te escriban, las vas a ver acá.</p>';
      } else {
        const lm = stats.last_message;
        const preview = lm
          ? `<div class="icard-last-msg">
               <div class="icard-last-meta">
                 <span class="icard-last-who">${formatPhone(lm.customer_id)}</span>
                 <span class="icard-last-time">${timeAgo(lm.msg_at)}</span>
               </div>
               <p class="icard-last-text">${escapeHtml(lm.content.slice(0, 100))}${lm.content.length > 100 ? '…' : ''}</p>
             </div>`
          : '';
        convsEl.innerHTML = `
          <div class="icard-big-num icard-big-num--text">${count}</div>
          <p class="icard-big-label">conversacion${count !== 1 ? 'es' : ''} en total.</p>
          ${preview}
        `;
      }
    })();
  </script>

  </main>
  </div><!-- /app-layout -->

        <line x1="2" y1="12" x2="14" y2="12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        <circle cx="5" cy="4" r="1.8" fill="var(--surface)" stroke="currentColor" stroke-width="1.4"/>

    <button class="mobile-nav-item" id="btn-logout-mobile">

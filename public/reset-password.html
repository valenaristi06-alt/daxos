<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña — Daxos</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f3f4f6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    .card { background: #fff; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); padding: 36px 32px; width: 100%; max-width: 380px; }
    h1 { font-size: 1.25rem; color: #111827; margin-bottom: 8px; }
    p.sub { color: #6b7280; font-size: .9rem; margin-bottom: 24px; }
    label { display: block; font-size: .875rem; font-weight: 500; color: #374151; margin-bottom: 4px; }
    input[type=password], input[type=text] { width: 100%; padding: 10px 42px 10px 12px; border: 1px solid #d1d5db; border-radius: 8px; font-size: .95rem; outline: none; transition: border-color .15s; }
    input[type=password]:focus, input[type=text]:focus { border-color: #2563eb; }
    .pw-wrap { position: relative; }
    .pw-toggle { position:absolute; right:8px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#9ca3af; padding:6px; display:flex; align-items:center; min-width:36px; min-height:36px; justify-content:center; border-radius:4px; transition:color .15s; }
    .pw-toggle:hover { color:#374151; }
    button { margin-top: 20px; width: 100%; padding: 11px; background: #2563eb; color: #fff; border: none; border-radius: 8px; font-size: .95rem; font-weight: 600; cursor: pointer; transition: background .15s; }
    button:disabled { background: #93c5fd; cursor: default; }
    button:hover:not(:disabled) { background: #1d4ed8; }
    .msg { margin-top: 16px; font-size: .875rem; padding: 10px 14px; border-radius: 8px; display: none; }
    .msg.ok  { background: #d1fae5; color: #065f46; display: block; }
    .msg.err { background: #fee2e2; color: #991b1b; display: block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Nueva contraseña</h1>
    <p class="sub">Ingresá tu nueva contraseña.</p>
    <form id="form">
      <label for="pw">Contraseña</label>
      <div class="pw-wrap">
        <input id="pw" type="password" minlength="8" placeholder="Mínimo 8 caracteres" required autocomplete="new-password" />
        <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" onclick="togglePw('pw',this)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <label for="pw2" style="margin-top:14px">Confirmar contraseña</label>
      <div class="pw-wrap">
        <input id="pw2" type="password" minlength="8" placeholder="Repetí la contraseña" required autocomplete="new-password" />
        <button type="button" class="pw-toggle" aria-label="Mostrar contraseña" onclick="togglePw('pw2',this)"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
      </div>
      <button type="submit" id="btn">Cambiar contraseña</button>
    </form>
    <div id="msg" class="msg"></div>
  </div>
  <script>
    const _EYE    = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;
    const _EYEOFF = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;
    function togglePw(id, btn) {
      const inp = document.getElementById(id);
      const show = inp.type === 'password';
      inp.type = show ? 'text' : 'password';
      btn.innerHTML = show ? _EYEOFF : _EYE;
      btn.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    }

    const token = new URLSearchParams(location.search).get('token');
    if (!token) {
      document.getElementById('msg').className = 'msg err';
      document.getElementById('msg').textContent = 'Enlace inválido. Solicitá uno nuevo.';
      document.getElementById('form').style.display = 'none';
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const pw  = document.getElementById('pw').value;
      const pw2 = document.getElementById('pw2').value;
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn');
      msg.className = 'msg';
      msg.textContent = '';

      if (pw !== pw2) {
        msg.className = 'msg err';
        msg.textContent = 'Las contraseñas no coinciden.';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        const r = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: pw }),
        });
        const data = await r.json();
        if (r.ok) {
          msg.className = 'msg ok';
          msg.textContent = '¡Contraseña actualizada! Ya podés iniciar sesión.';
          document.getElementById('form').style.display = 'none';
        } else {
          msg.className = 'msg err';
          msg.textContent = data.error || 'Error al actualizar la contraseña.';
          btn.disabled = false;
          btn.textContent = 'Cambiar contraseña';
        }
      } catch {
        msg.className = 'msg err';
        msg.textContent = 'Error de red. Intentá de nuevo.';
        btn.disabled = false;
        btn.textContent = 'Cambiar contraseña';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logodaxosnaranjanofondo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Daxos</title>
  <link rel="stylesheet" href="/dashboard.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 2px solid var(--accent);
      padding: 36px 32px 32px;
    }
    .login-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .login-logo {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: var(--accent);
      text-transform: uppercase;
    }
    .admin-badge {
      font-family: var(--mono);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--bg);
      background: var(--accent);
      padding: 2px 6px;
      text-transform: uppercase;
    }
    .login-label {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      color: var(--muted-2);
      text-transform: uppercase;
      display: block;
      margin-bottom: 6px;
      margin-top: 16px;
    }
    .login-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border-2);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .login-input:focus { border-color: var(--accent); }
    .login-btn {
      width: 100%;
      margin-top: 24px;
      background: var(--accent);
      color: #fff;
      border: none;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 11px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .login-btn:hover { opacity: 0.88; }
    .login-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .login-error {
      margin-top: 14px;
      font-size: 12px;
      color: var(--danger);
      font-family: var(--mono);
      display: none;
    }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-header">
      <span class="login-logo">Daxos</span>
      <span class="admin-badge">Admin</span>
    </div>
    <p style="font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:4px;">&gt; acceso restringido</p>
    <form id="form" autocomplete="on">
      <label class="login-label" for="email">Email</label>
      <input class="login-input" id="email" type="email" name="email" required autocomplete="email" />
      <label class="login-label" for="password">Contraseña</label>
      <input class="login-input" id="password" type="password" name="password" required autocomplete="current-password" />
      <button class="login-btn" type="submit" id="btn">Ingresar al panel</button>
    </form>
    <p class="login-error" id="error"></p>
  </div>
</div>
<script>
  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const err = document.getElementById('error');
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Verificando...';
    try {
      const r = await fetch('/admin/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
        }),
      });
      const data = await r.json();
      if (r.ok) {
        window.location.href = '/admin/inicio';
      } else {
        err.textContent = data.error || 'Error al ingresar';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Ingresar al panel';
      }
    } catch {
      err.textContent = 'Error de red';
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Ingresar al panel';
    }
  });
</script>
</body>
</html>

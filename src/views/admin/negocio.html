<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logodaxosnaranjanofondo.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Negocio — Admin Daxos</title>
  <link rel="stylesheet" href="/dashboard.css" />
  <style>
    .admin-badge {
      font-family: var(--mono);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: var(--bg);
      background: var(--accent);
      padding: 2px 5px;
      text-transform: uppercase;
      vertical-align: middle;
      margin-left: 4px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-2);
      text-decoration: none;
      margin-bottom: 24px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent); }
    .detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 32px;
    }
    @media (max-width: 680px) { .detail-grid { grid-template-columns: 1fr; } }
    .detail-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent);
      padding: 20px;
    }
    .detail-card-title {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 16px;
    }
    .field-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px solid var(--border);
    }
    .field-row:last-child { border-bottom: none; }
    .field-key {
      font-family: var(--mono);
      font-size: 10px;
      color: var(--muted);
      letter-spacing: 0.06em;
      flex-shrink: 0;
    }
    .field-val {
      font-size: 13px;
      color: var(--text);
      text-align: right;
      word-break: break-all;
    }
    .field-val.muted { color: var(--muted-2); }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .metric-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 16px 18px;
    }
    .metric-label {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 6px;
    }
    .metric-value {
      font-family: var(--serif);
      font-size: 26px;
      color: var(--text);
      line-height: 1;
    }
    .plan-pill {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      padding: 2px 7px;
      border: 1px solid var(--border-2);
      color: var(--muted-2);
    }
    .plan-pill.paying { border-color: var(--accent); color: var(--accent); }
    .section-title {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 12px;
    }
    .action-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 2px solid var(--accent);
      padding: 20px;
      margin-bottom: 32px;
      max-width: 480px;
    }
    .action-card-title {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted-2);
      margin-bottom: 16px;
    }
    .action-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .action-status {
      font-size: 12px;
      color: var(--muted-2);
      margin-bottom: 14px;
      font-family: var(--mono);
    }
    .action-status.active { color: #f97316; }
    .action-input {
      width: 80px;
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border-2);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
    }
    .action-input:focus { outline: none; border-color: var(--accent); }
    .btn-action {
      padding: 7px 14px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      border: none;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
    }
    .btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-action-ghost {
      padding: 7px 14px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      border: 1px solid var(--border-2);
      cursor: pointer;
      background: transparent;
      color: var(--muted-2);
    }
    .btn-action-ghost:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
<div class="app-layout">

  <aside class="app-sidebar">
    <a href="/admin/inicio" class="sidebar-logo">
      <img src="/logodaxosnaranjanofondo.png" alt="" class="logo-img">DAXOS<span class="admin-badge">Admin</span>
    </a>
    <div class="sidebar-divider"></div>
    <nav class="sidebar-nav">
      <a href="/admin/inicio" class="sidebar-link">
        <svg class="sidebar-link-icon" width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M2 8L8 2L14 8V14H10V10H6V14H2V8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        </svg>
        Inicio
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button class="btn-logout" id="btn-logout">Salir</button>
    </div>
  </aside>

  <main class="app-main">
    <a href="/admin/inicio" class="back-link">
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Volver al panel
    </a>

    <p class="page-terminal" id="page-terminal">&gt; negocio.detail</p>
    <h1 class="page-title" id="page-title">Cargando...</h1>

    <p class="section-title">Métricas de uso</p>
    <div class="metric-grid">
      <div class="metric-card"><div class="metric-label">Conversaciones</div><div class="metric-value" id="m-convs">—</div></div>
      <div class="metric-card"><div class="metric-label">Mensajes totales</div><div class="metric-value" id="m-msgs">—</div></div>
      <div class="metric-card"><div class="metric-label">Replies IA</div><div class="metric-value" id="m-ai">—</div></div>
      <div class="metric-card"><div class="metric-label">Pausadas</div><div class="metric-value" id="m-paused">—</div></div>
      <div class="metric-card"><div class="metric-label">Msgs este mes</div><div class="metric-value" id="m-month">—</div></div>
    </div>

    <p class="section-title">Configuración</p>
    <div class="detail-grid">
      <div class="detail-card">
        <div class="detail-card-title">General</div>
        <div id="config-general"></div>
      </div>
      <div class="detail-card">
        <div class="detail-card-title">Estado y plan</div>
        <div id="config-plan"></div>
      </div>
    </div>

    <p class="section-title">Acciones</p>
    <div class="action-card">
      <div class="action-card-title">WhatsApp</div>
      <div id="wa-status-rows"></div>
      <div class="action-row" id="wa-disconnect-row" style="margin-top:14px; display:none">
        <button class="btn-action-ghost" onclick="disconnectWa()">Desconectar WhatsApp</button>
      </div>
    </div>
    <div class="action-card">
      <div class="action-card-title">Ventana de silencio</div>
      <div class="action-status" id="silence-status">Cargando…</div>
      <div class="action-row">
        <input class="action-input" type="number" id="silence-minutes" min="1" max="1440" placeholder="min" title="Minutos (1–1440)">
        <button class="btn-action" id="btn-silence" onclick="setSilence()">Silenciar ahora</button>
        <button class="btn-action-ghost" id="btn-unsilence" onclick="clearSilence()" style="display:none">Quitar silencio</button>
      </div>
    </div>

  </main>
</div>

<script>
  let _bizId = null;

  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function fmt(iso) {
    if (!iso) return '—';
    const d = new Date(iso.includes('T') || iso.endsWith('Z') ? iso : iso + 'Z');
    return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: '2-digit' });
  }
  function row(key, val, muted) {
    return `<div class="field-row"><span class="field-key">${key}</span><span class="field-val${muted ? ' muted' : ''}">${val}</span></div>`;
  }

  function renderSilenceStatus(silentUntil) {
    const statusEl   = document.getElementById('silence-status');
    const unsilenceBtn = document.getElementById('btn-unsilence');
    if (!silentUntil) {
      statusEl.textContent = 'Bot activo';
      statusEl.className   = 'action-status';
      unsilenceBtn.style.display = 'none';
      return;
    }
    const untilMs = new Date(silentUntil.includes('T') || silentUntil.endsWith('Z') ? silentUntil : silentUntil + 'Z').getTime();
    if (Date.now() >= untilMs) {
      statusEl.textContent = 'Bot activo (ventana venció)';
      statusEl.className   = 'action-status';
      unsilenceBtn.style.display = 'none';
      return;
    }
    const hhMM = new Intl.DateTimeFormat('es-UY', {
      timeZone: 'America/Montevideo',
      hour: '2-digit', minute: '2-digit', hour12: false,
    }).format(new Date(untilMs));
    statusEl.textContent = `Silenciado hasta ${hhMM} (hora de Uruguay)`;
    statusEl.className   = 'action-status active';
    unsilenceBtn.style.display = '';
  }

  async function setSilence() {
    const minutes = parseInt(document.getElementById('silence-minutes').value, 10);
    if (isNaN(minutes) || minutes < 1 || minutes > 1440) {
      alert('Ingresá un valor entre 1 y 1440 minutos.');
      return;
    }
    const btn = document.getElementById('btn-silence');
    btn.disabled = true;
    const r = await fetch(`/admin/api/silent/${_bizId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ minutes }),
    });
    btn.disabled = false;
    if (!r.ok) { alert('Error al silenciar.'); return; }
    const { silent_until } = await r.json();
    renderSilenceStatus(silent_until);
  }

  async function clearSilence() {
    const r = await fetch(`/admin/api/silent/${_bizId}`, { method: 'DELETE' });
    if (!r.ok) { alert('Error al quitar silencio.'); return; }
    renderSilenceStatus(null);
  }

  function renderWaStatus(d) {
    const rowsEl = document.getElementById('wa-status-rows');
    const disconnectRow = document.getElementById('wa-disconnect-row');
    if (!rowsEl) return;
    const pnid = d.phone_number_id;
    const last4 = pnid ? '…' + String(pnid).slice(-4) : null;
    let html = '';
    html += row('ID de número (termina en)', last4 ? escHtml(last4) : '—', !pnid);
    html += row('Proveedor', escHtml(d.wa_provider || '—'), !d.wa_provider || d.wa_provider === 'meta');
    html += row('Conectado', d.wa_connected_at ? fmt(d.wa_connected_at) : '—', !d.wa_connected_at);
    html += row('Estado', pnid
      ? '<span style="color:#22c55e;font-size:12px">● conectado</span>'
      : '<span style="color:var(--muted-2);font-size:12px">○ sin número</span>', false);
    rowsEl.innerHTML = html;
    disconnectRow.style.display = pnid ? '' : 'none';
  }

  async function disconnectWa() {
    if (!confirm('Esto borra la conexión guardada de este negocio y el bot dejará de contestar hasta que se vuelva a conectar. No borra chats ni configuración. No desconecta nada en Kapso ni en WhatsApp.')) return;
    const r = await fetch(`/admin/api/wa-disconnect/${_bizId}`, { method: 'POST' });
    if (!r.ok) { alert('Error al desconectar.'); return; }
    const br = await fetch(`/admin/api/business/${_bizId}`);
    if (br.ok) renderWaStatus(await br.json());
  }

  async function load() {
    const me = await fetch('/admin/auth/me');
    if (!me.ok) { window.location.href = '/admin/login'; return; }

    const id = window.location.pathname.split('/').pop();
    _bizId = id;
    const r = await fetch(`/admin/api/business/${id}`);
    if (!r.ok) { document.getElementById('page-title').textContent = 'Negocio no encontrado'; return; }

    const d = await r.json();

    document.getElementById('page-terminal').textContent = `> negocio.${d.id}`;
    document.getElementById('page-title').textContent = d.name;

    // Metrics
    document.getElementById('m-convs').textContent  = d.metrics.conversations;
    document.getElementById('m-msgs').textContent   = d.metrics.totalMessages;
    document.getElementById('m-ai').textContent     = d.metrics.aiReplies;
    document.getElementById('m-paused').textContent = d.metrics.paused;
    document.getElementById('m-month').textContent  = d.metrics.messagesThisMonth;

    // Config — general
    let gen = '';
    gen += row('Owner', escHtml(d.owner_email || '—'), true);
    gen += row('WhatsApp ID', escHtml(d.whatsapp_number || '—'), true);
    gen += row('Sitio web', d.website_url ? `<a href="${escHtml(d.website_url)}" target="_blank" rel="noopener" style="color:var(--accent);font-size:12px;">${escHtml(d.website_url)}</a>` : '—', false);
    gen += row('Modo respuesta', escHtml(d.response_mode || '—'), true);
    gen += row('Voz clonada', d.voice_id ? 'Sí' : 'No', !d.voice_id);
    gen += row('Documento', d.document_name ? escHtml(d.document_name) : '—', !d.document_name);
    gen += row('Alta', fmt(d.created_at), true);
    document.getElementById('config-general').innerHTML = gen;

    // Config — plan / status
    const isPaying = d.plan && d.plan !== 'arranque';
    let pl = '';
    pl += row('Plan', `<span class="plan-pill ${isPaying ? 'paying' : ''}">${escHtml(d.plan || 'arranque')}</span>`, false);
    pl += row('Estado suscripción', escHtml(d.subscription_status || '—'), true);
    pl += row('Trial vence', fmt(d.trial_ends_at), true);
    pl += row('Plan pagado', fmt(d.plan_paid_at), true);
    pl += row('Plan vence', fmt(d.plan_expires_at), true);
    document.getElementById('config-plan').innerHTML = pl;

    // WhatsApp status
    renderWaStatus(d);

    // Silence status
    renderSilenceStatus(d.silent_until || null);
  }

  document.getElementById('btn-logout').addEventListener('click', async () => {
    await fetch('/admin/auth/logout', { method: 'POST' });
    window.location.href = '/admin/login';
  });

  load();
</script>
</body>
</html>
